# Riftbound Card Sorter, option B (turntable picker): part-by-part assembly video, driven by make_video.py.
# Order follows cad_b/README.md (round 5.1 assembly order). Every part, fastener and consumable named
# here must have a line in cad_b/BOM_B.md (bought or "already owned"); gaps are reported, not invented.
# parts: {wrapper: {stl name: material}}; stl name = part="v3_<name>" in w_b.scad.
# cams: name: [target mm, distance mm, azimuth deg (0 = from -Y, + toward +X), elevation, drift deg/s, f-stop]
title: Riftbound Card Sorter, option B
voice: af_heart
speed: 1.12
floor_z: -26          # bench top = underside of the printed feet
scene_radius: 650
steps:
  1: Board and feet
  2: Pedestal and yaw motor
  3: Bearing and turntable
  4: Home switch
  5: Lift servo and links
  6: Hand, slider and cup
  7: Hopper, bins and reject
  8: Scan and weigh station
  9: Camera tower
  10: Cable post, tube and electronics

parts:
  w_b:
    board: mdf
    feet: "petg:#3B3E43"
    feet_scr: screw
    pedestal: "petg:#5C6B7A"
    ped_scr: screw
    motor: "alu:#2E3034"
    motor_shaft: steel
    deck: "petg:#6E7F90"
    motor_scr: screw
    deck_scr: screw
    bearing: steel
    bear_top_scr: screw
    bear_bot_scr: screw
    turntable: "petg:#2E78C9"
    collar: "petg:#F0BE2A"
    collar_ss: screw
    collar_scr: screw
    cradle: "petg:#E2742B"
    switch: chip
    cradle_scr: screw
    servo: chip
    servo_scr: screw
    horn: alu
    link_a: "petg:#C73A3F"
    horn_scr: screw
    link_b: "petg:#D9565B"
    p2_pin: screw
    hand: "petg:#2E78C9"
    hand_pins: screw
    contacts: screw
    slider: "petg:#F4F3EE"
    tee: "petg:#FAFAFA"
    cup: "rubber:#E2742B"
    ring608: steel
    cap: "petg:#F0BE2A"
    cap_scr: screw
    hopper: "petg:#3A9E95"
    hopper_scr: screw
    bin1: "petg:#A4A7A9"
    bin1_scr: screw
    bin2: "petg:#A4A7A9"
    bin2_scr: screw
    bin3: "petg:#A4A7A9"
    bin3_scr: screw
    bin4: "petg:#A4A7A9"
    bin4_scr: screw
    bin5: "petg:#A4A7A9"
    bin5_scr: screw
    bin6: "petg:#A4A7A9"
    bin6_scr: screw
    bin7: "petg:#C73A3F"
    bin7_scr: screw
    cell_block: "petg:#4CAF7A"
    cellblk_scr: screw
    cell_scr_up: screw
    cell: alu
    bed: "petg:#E9E7E2"
    bed_scr: screw
    post: "petg:#8C5A2B"
    post_scr: screw
    boom: "petg:#B07A45"
    boom_scr: screw
    camera: pcb
    lens_frame: petg_matte
    lens: "petg:#CFE8FF"
    lens_scr: screw
    pi_standoffs: brass
    pi: pcb
    pi_scr: screw
    ring_holder: "petg:#B07A45"
    ring_scr: screw
    led_ring: led
    cable_post: "petg:#5C6B7A"
    cpost_scr: screw
    tube: "rubber:#7FB8E6"
    leads: "rubber:#B22222"
    leads_hand: "rubber:#B22222"
    zipties: rubber
    el_pump: "alu:#B8BBC0"
    el_relay: "pcb:#1E4C98"
    el_pca: "pcb:#1E4C98"
    el_tmc: "pcb:#6A3FA0"
    el_hx711: pcb
    el_drok: "petg:#202020"

cams:
  intro:     [[0, 60, 60], 1350, -30, 35, 4.0, 11]
  board:     [[0, 15, 0], 1250, -20, 50, 0.6, 11]
  below:     [[0, 15, -12], 1150, -20, -30, 0.6, 11]
  ped:       [[0, 0, 25], 430, -30, 38, 0.6, 8]
  bench:     [[0, 0, 160], 340, -30, -14, 0.5, 7]
  bench_top: [[0, 0, 178], 300, -30, 58, 0.4, 7]
  tt_bench:  [[0, 0, 170], 480, -35, 20, 0.5, 8]
  deck_top:  [[0, 0, 45], 330, -25, 62, 0.4, 7]
  deck_xray: [[0, 0, 45], 330, -25, 50, 0.4, 7]
  turntable: [[0, 0, 55], 480, -35, 35, 0.6, 8]
  collar:    [[0, 0, 52], 190, 200, 35, 0.3, 6]
  switch:    [[0, -100, 48], 300, 15, 30, 0.4, 7]
  arm:       [[-44, 122, 90], 680, -70, 20, 0.6, 9]
  servo:     [[-10, 20, 80], 300, -70, 22, 0.4, 7]
  hand:      [[-89, 244, 85], 300, -70, 22, 0.4, 7]
  hand_low:  [[-89, 244, 40], 340, -70, 12, 0.4, 7]
  hand_top:  [[-89, 244, 120], 240, -60, 58, 0.3, 6]
  stations:  [[0, 170, 15], 950, 180, 48, 0.6, 10]
  hopper:    [[256, 45, 20], 380, -80, 55, 0.4, 8]
  scan:      [[225, 130, 20], 360, 120, 32, 0.4, 7]
  post_base: [[256, 217, 15], 330, 100, 42, 0.4, 7]
  tower:     [[240, 165, 140], 700, 120, 14, 0.5, 9]
  boom_bench: [[225, 130, 318], 260, 90, 40, 0.3, 6]
  pi_cam:    [[240, 173, 245], 300, 100, 50, 0.3, 7]
  boom_top:  [[240, 140, 335], 320, 100, 55, 0.3, 7]
  back:      [[0, -200, 40], 720, 0, 35, 0.5, 9]
  cable:     [[0, -100, 100], 620, -40, 22, 0.5, 9]
  outro:     [[0, 60, 60], 1350, -30, 32, 6.0, 11]

# bench offsets: motor + deck [0, 0, 140]; turntable + bearing [0, 0, 120]; boom + camera + lens frame [0, 0, 90]
segments:
  - id: intro
    title: Riftbound Card Sorter, option B
    subtitle: Turntable picker, assembled part by part
    caption: "Before you start: measure the bearing's hole spacing and set it in the CAD, print every part, fit the M3 heat-set inserts, and drill the board from the 1:1 template"
    say: "The option B card sorter, built part by part. Measure the bearing, print the parts, fit the inserts, and drill the board from the template."
    cam: intro

  # ── Step 1 ──
  - id: s1_board
    step: 1
    caption: "Backing board: 1/2 in (12 mm) plywood, 2 × 2 ft. Tape the printed template on, flush with the edges, and drill every mark Ø2.5 mm, ~10 mm deep"
    say: "Step one. The two foot plywood board. Tape on the template and drill every mark."
    cam: board
    add: [{parts: [board], from: [0, 0, 160], dur: 1.4}]
  - id: s1_feet
    step: 1
    caption: "4 printed feet under the corners, open side down: M3 × 12 up through each foot's floor into the board"
    say: "Four printed feet under the corners, one M three by twelve each."
    cam: below
    no_bench: true
    add:
      - {parts: [feet], split: true, n: 4, stagger: 0.15, from: [0, 0, -60], dur: 0.9}
      - {parts: [feet_scr], split: true, n: 4, stagger: 0.15, from: [0, 0, -40], delay: 1.0, dur: 0.8, spin: 3}

  # ── Step 2 ──
  - id: s2_pedestal
    step: 2
    caption: "Pedestal on its 4 template holes (yaw axis 290 mm from the electronics edge, centred side to side), lead slot toward the electronics edge: 4 × M3 × 12"
    say: "Step two. The pedestal tube sits on its four template holes, with four M three by twelve screws."
    cam: ped
    add:
      - {parts: [pedestal], from: [0, 0, 120], dur: 1.2}
      - {parts: [ped_scr], split: true, n: 4, stagger: 0.12, from: [0, 0, 40], delay: 1.3, dur: 0.8, spin: 3}
  - id: s2_motor
    step: 2
    caption: "On the bench: NEMA 17 pancake under the deck, its round boss up into the Ø22 hole"
    say: "On the bench, the NEMA seventeen motor goes under the deck, its boss up into the centre hole."
    cam: bench
    add:
      - {parts: [deck], at: [0, 0, 140], from: [0, 0, 60], dur: 1.0}
      - {parts: [motor, motor_shaft], at: [0, 0, 140], from: [0, 0, -70], delay: 0.9, dur: 1.1}
  - id: s2_motor_scr
    step: 2
    caption: "4 × M3 × 8 down through the deck into the motor. Not reachable later: tighten fully now"
    say: "Four M three by eight screws, down into the motor. Tighten them now, you can't reach them later."
    cam: bench_top
    add: [{parts: [motor_scr], at: [0, 0, 140], split: true, n: 4, stagger: 0.12, from: [0, 0, 30], dur: 0.8, spin: 3}]
  - id: s2_deck
    step: 2
    caption: "Lower the deck + motor onto the tube, bearing pocket up; motor leads out through the slot"
    say: "Lower the deck and motor onto the tube, and run the motor leads out through the slot."
    cam: ped
    move: [{parts: [deck, motor, motor_shaft, motor_scr], to: [0, 0, 0], dur: 1.6}]
  - id: s2_deck_scr
    step: 2
    caption: "4 × M3 × 10 through the deck into the tube's bosses"
    say: "Four M three by ten screws hold the deck to the tube."
    cam: deck_top
    add: [{parts: [deck_scr], split: true, n: 4, stagger: 0.12, from: [0, 0, 30], dur: 0.8, spin: 3}]

  # ── Step 3 ──
  - id: s3_top_plate
    step: 3
    caption: "Bench: lazy-susan bearing (drawn as a plain block) under the turntable. Turn the plates 45° apart, then 4 × M3 × 6 up through the top plate into the turntable"
    say: "Step three. On the bench, turn the bearing's plates apart, and screw the top plate to the turntable from below."
    cam: tt_bench
    add:
      - {parts: [bearing], at: [0, 0, 120], from: [0, 0, 60], dur: 1.0}
      - {parts: [turntable], at: [0, 0, 120], from: [0, 0, 80], delay: 0.9, dur: 1.0}
      - {parts: [bear_top_scr], at: [0, 0, 120], split: true, n: 4, stagger: 0.12, from: [0, 0, -30], delay: 2.0, dur: 0.8, spin: 3}
  - id: s3_onto_deck
    step: 3
    caption: "Set it on the deck: bottom plate loose in its pocket, motor shaft up through the turntable's centre hole"
    say: "Set it on the deck, with the bottom plate loose in its pocket and the shaft through the centre."
    cam: turntable
    move: [{parts: [bearing, turntable, bear_top_scr], to: [0, 0, 0], dur: 1.5}]
  - id: s3_collar
    step: 3
    caption: "Collar over the shaft: M3 nut in its slot, M3 × 8 socket screw through the notch onto the shaft's flat, tight"
    say: "Drop the collar over the shaft, and tighten its screw onto the flat."
    cam: collar
    add:
      - {parts: [collar], from: [0, 0, 40], dur: 1.0}
      - {parts: [collar_ss], from: [0, 0, 30], delay: 1.0, dur: 0.9}
  - id: s3_collar_scr
    step: 3
    caption: "2 × M3 × 10 through the collar ears into the turntable, fully tight"
    say: "Two M three by ten screws lock the collar to the turntable."
    add: [{parts: [collar_scr], split: true, n: 2, stagger: 0.15, from: [0, 0, 30], dur: 0.8, spin: 3}]
  - id: s3_bot_scr
    step: 3
    caption: "Bottom plate (turntable hidden here): 4 × M3 × 6 + washers through the turntable's Ø8 access holes, arm at +45° then −45°. Snug, swing the arm a full turn, tighten"
    say: "Through the access holes, four M three by six screws with washers. Snug them, swing the arm once, then tighten."
    cam: deck_xray
    hide: [turntable, collar, collar_ss, collar_scr, bear_top_scr]
    add: [{parts: [bear_bot_scr], split: true, n: 4, stagger: 0.2, from: [0, 0, 40], dur: 0.8, spin: 3}]

  # ── Step 4 ──
  - id: s4_cradle
    step: 4
    caption: "Solder 2 leads to the KW12-3's COM and NC tags, press it into the cradle: lever toward the turntable, tags out the back"
    say: "Step four. Solder two leads to the home switch, and press it into its cradle, lever toward the turntable."
    cam: switch
    show: [turntable, collar, collar_ss, collar_scr, bear_top_scr]
    add:
      - {parts: [cradle], from: [0, -40, 30], dur: 1.0}
      - {parts: [switch], from: [0, 0, 30], delay: 1.0, dur: 0.8}
  - id: s4_cradle_scr
    step: 4
    caption: "Turn the arm to home (0°, drawn here at 110°). 2 × M3 × 12 + washers through the slots; slide in until the roller clicks on the rim, ~1 mm more, tighten"
    say: "Turn the arm to home. Two M three by twelve screws through the slots. Slide it in until the roller clicks on the rim, then tighten."
    add: [{parts: [cradle_scr], split: true, n: 2, stagger: 0.15, from: [0, 0, 30], dur: 0.8, spin: 3}]

  # ── Step 5 ──
  - id: s5_servo
    step: 5
    caption: "MG996R lift servo through the mast, spline toward the arm side"
    say: "Step five. The lift servo slides into the mast."
    cam: servo
    add: [{parts: [servo], from: [0, 0, 60], dur: 1.1}]
  - id: s5_servo_scr
    step: 5
    caption: "4 × M3 × 12 through the servo tabs and the mast wall, nuts on the back (no washers)"
    say: "Four M three by twelve screws through the tabs, with nuts on the back."
    add: [{parts: [servo_scr], split: true, n: 8, stagger: 0.08, from: [0, 0, 25], dur: 0.8}]
  - id: s5_horn
    step: 5
    caption: "Centre the servo (90°, driven from the PCA9685 + Pi on the bench), press the round horn on the spline, fit the horn's centre screw (comes with the servo)"
    say: "Centre the servo on the bench, then press the round horn onto the spline and fit its centre screw."
    add: [{parts: [horn], from: [0, 0, 30], dur: 0.9}]
  - id: s5_link_a
    step: 5
    caption: "Lower link onto the horn, level: 4 × M2.5 × 6 (from the standoff kit)"
    say: "The lower link bolts to the horn with four M two point five by six screws."
    cam: arm
    add:
      - {parts: [link_a], from: [0, 0, 60], dur: 1.1}
      - {parts: [horn_scr], split: true, n: 4, stagger: 0.1, from: [0, 0, 25], delay: 1.1, dur: 0.7, spin: 2}
  - id: s5_link_b
    step: 5
    caption: "Upper link on the mast's top pivot: printed sleeve + M3 × 16 into the insert"
    say: "The upper link pivots on a printed sleeve and an M three by sixteen."
    add:
      - {parts: [link_b], from: [0, 0, 60], dur: 1.1}
      - {parts: [p2_pin], from: [0, 0, 30], delay: 1.1, dur: 0.8}

  # ── Step 6 ──
  - id: s6_hand
    step: 6
    caption: "Hand on the two link ends: 2 printed sleeves + 2 × M3 × 16 into the hand's inserts"
    say: "Step six. The hand joins both link ends, with two sleeves and two M three by sixteens."
    cam: hand
    add:
      - {parts: [hand], from: [0, 0, 60], dur: 1.1}
      - {parts: [hand_pins], split: true, n: 2, stagger: 0.2, from: [0, 0, 30], delay: 1.1, dur: 0.8}
  - id: s6_contacts
    step: 6
    caption: "3 × M3 × 6 into the top inserts, heads up. Touch-switch leads: a bare loop under the 2 wired heads, a same-size loop under the 3rd so all 3 stay level"
    say: "Three M three by six screws go in the top, heads up. Two of them carry the touch switch leads."
    cam: hand_top
    add: [{parts: [contacts], split: true, n: 3, stagger: 0.15, from: [0, 0, 25], dur: 0.8, spin: 2}]
  - id: s6_slider
    step: 6
    caption: "Bare slider down through the hand's D-shaped bore from the top, flat facing out; hold it from below"
    say: "Drop the bare slider down through the hand from the top, flat side out."
    cam: hand
    add: [{parts: [slider], from: [0, 0, 70], dur: 1.3}]
  - id: s6_ring
    step: 6
    caption: "608 bearing on the slider's top stub, printed cap + M3 × 8"
    say: "A six oh eight bearing on top, then the cap and an M three by eight."
    cam: hand_top
    add:
      - {parts: [ring608], from: [0, 0, 30], dur: 0.8}
      - {parts: [cap], from: [0, 0, 30], delay: 0.8, dur: 0.7}
      - {parts: [cap_scr], from: [0, 0, 25], delay: 1.4, dur: 0.7, spin: 3}
  - id: s6_tee
    step: 6
    caption: "From below: airline tee snapped into the slider's bottom pocket, cup's neck pushed onto its stem. Spare leg: 2 cm tube stub, folded shut with a zip tie, one pin-hole (the bleed)"
    say: "From below, snap the airline tee into the slider and push the cup onto it. Close the spare leg with a short folded tube, and prick one pin hole."
    cam: hand_low
    add:
      - {parts: [tee], from: [0, 0, -12], dur: 0.9}
      - {parts: [cup], from: [0, 0, -12], delay: 0.9, dur: 0.9}

  # ── Step 7 ──
  - id: s7_hopper
    step: 7
    caption: "Hopper on its 2 template holes (10° station): 2 × M3 × 12 through the ears"
    say: "Step seven. The hopper, with two M three by twelve screws."
    cam: hopper
    add:
      - {parts: [hopper], from: [0, 0, 80], dur: 1.0}
      - {parts: [hopper_scr], split: true, n: 2, stagger: 0.15, from: [0, 0, 30], delay: 1.0, dur: 0.8, spin: 3}
  - id: s7_bins
    step: 7
    caption: "6 bins on their template holes (50° to 150°): 2 × M3 × 12 each"
    say: "Six bins around the arc, two screws each."
    cam: stations
    add:
      - {parts: [bin1, bin1_scr], from: [0, 0, 80], delay: 0.1, dur: 0.8}
      - {parts: [bin2, bin2_scr], from: [0, 0, 80], delay: 0.4, dur: 0.8}
      - {parts: [bin3, bin3_scr], from: [0, 0, 80], delay: 0.7, dur: 0.8}
      - {parts: [bin4, bin4_scr], from: [0, 0, 80], delay: 1.0, dur: 0.8}
      - {parts: [bin5, bin5_scr], from: [0, 0, 80], delay: 1.3, dur: 0.8}
      - {parts: [bin6, bin6_scr], from: [0, 0, 80], delay: 1.6, dur: 0.8}
  - id: s7_reject
    step: 7
    caption: "Reject bin last, at 170°: 2 × M3 × 12"
    say: "The reject bin goes last."
    add: [{parts: [bin7, bin7_scr], from: [0, 0, 80], dur: 1.0}]

  # ── Step 8 ──
  - id: s8_block
    step: 8
    caption: "Load-cell block: 2 × M4 × 10 up from underneath into the cell's fixed end first, then 2 × M3 × 12 down into the board"
    say: "Step eight. The load cell block. Two M four by ten from below into the cell, then two M three screws into the board."
    cam: scan
    add:
      - {parts: [cell_block], from: [0, 0, 60], dur: 1.0}
      - {parts: [cell], from: [0, 0, 50], delay: 0.8, dur: 0.9}
      - {parts: [cell_scr_up], split: true, n: 2, stagger: 0.15, from: [0, 0, -30], delay: 1.5, dur: 0.8, spin: 3}
      - {parts: [cellblk_scr], split: true, n: 2, stagger: 0.15, from: [0, 0, 30], delay: 2.2, dur: 0.8, spin: 3}
  - id: s8_bed
    step: 8
    caption: "Scan bed on the cell's free end: 2 × M4 × 10 down, heads in the recesses. It must not touch the block"
    say: "The scan bed sits on the free end, with two M four by ten screws. Make sure it doesn't touch the block."
    add:
      - {parts: [bed], from: [0, 0, 50], dur: 1.0}
      - {parts: [bed_scr], split: true, n: 2, stagger: 0.15, from: [0, 0, 30], delay: 1.0, dur: 0.8, spin: 3}

  # ── Step 9 ──
  - id: s9_post
    step: 9
    caption: "Camera post beside the scan station: 4 × M3 × 12 into its template holes"
    say: "Step nine. The camera post, with four M three by twelve screws."
    cam: post_base
    add:
      - {parts: [post], from: [0, 0, 120], dur: 1.1}
      - {parts: [post_scr], split: true, n: 4, stagger: 0.1, from: [0, 0, 30], delay: 1.1, dur: 0.7, spin: 3}
  - id: s9_ring
    step: 9
    caption: "Ring holder FIRST (the boom blocks it later): LED ring glued in its recess, slide it down the post, M3 × 12 into the clamp's insert"
    say: "The LED ring holder goes on first. Glue the ring in, slide it down the post, and clamp it."
    cam: tower
    add:
      - {parts: [ring_holder, led_ring], from: [0, 0, 180], dur: 1.3}
      - {parts: [ring_scr], from: [30, 0, 0], delay: 1.3, dur: 0.7, spin: 3}
  - id: s9_camera
    step: 9
    caption: "On the bench: camera board face-down in the lens frame's top pocket (ribbon up), popped-out +5 glasses lens slid into the bottom pocket"
    say: "On the bench, the camera sits face down in the lens frame, and a lens from the plus five reading glasses slides in underneath."
    cam: boom_bench
    add:
      - {parts: [lens_frame, lens], at: [0, 0, 90], from: [0, 0, -50], dur: 1.0}
      - {parts: [camera], at: [0, 0, 90], from: [0, 0, 40], delay: 0.9, dur: 0.9}
  - id: s9_lens
    step: 9
    caption: "Boom on top (ribbon through its slot): 4 × M3 × 16 down through the boom into the frame. This clamps the camera board, no small screws needed"
    say: "Put the boom on top and drive four M three by sixteen screws down into the frame. That clamps the camera."
    cam: boom_top
    add:
      - {parts: [boom], at: [0, 0, 90], from: [0, 0, 40], dur: 0.9}
      - {parts: [lens_scr], at: [0, 0, 90], split: true, n: 4, stagger: 0.1, from: [0, 0, 25], delay: 0.9, dur: 0.6, spin: 3}
  - id: s9_boom
    step: 9
    caption: "Slide the boom down the post until the lens is 188 mm above the bed: M3 × 12 into the clamp's insert. Fine-focus later by sliding"
    say: "Slide the boom down the post, about nineteen centimetres above the bed, and clamp it."
    cam: tower
    move: [{parts: [boom, camera, lens_frame, lens, lens_scr], to: [0, 0, 0], dur: 1.6}]
    add: [{parts: [boom_scr], from: [30, 0, 0], delay: 1.7, dur: 0.7, spin: 3}]
  - id: s9_pi
    step: 9
    caption: "Pi Zero 2 W on the boom top: 4 M2.5 standoffs + 4 × M2.5 screws (standoff kit); camera ribbon to its port"
    say: "The Pi Zero sits on the boom on four standoffs."
    cam: pi_cam
    add:
      - {parts: [pi_standoffs], split: true, n: 4, stagger: 0.08, from: [0, 0, 25], dur: 0.6}
      - {parts: [pi], from: [0, 0, 40], delay: 0.7, dur: 0.8}
      - {parts: [pi_scr], split: true, n: 4, stagger: 0.08, from: [0, 0, 20], delay: 1.4, dur: 0.6, spin: 2}

  # ── Step 10 ──
  - id: s10_post
    step: 10
    caption: "Cable post behind the turntable: 4 × M3 × 12 into its template holes"
    say: "Step ten. The cable post, behind the turntable."
    cam: cable
    add:
      - {parts: [cable_post], from: [0, 0, 120], dur: 1.1}
      - {parts: [cpost_scr], split: true, n: 4, stagger: 0.1, from: [0, 0, 30], delay: 1.1, dur: 0.7, spin: 3}
  - id: s10_electronics
    step: 10
    caption: "Electronics along the edge opposite the bins (stand-in blocks, positions only: no mounts are drawn yet): pump, relay, PCA9685, TMC2209, HX711, 5 V converter"
