# Riftbound Card Sorter - part-by-part assembly video (v3), driven by make_video.py.
# Order and fasteners follow docs/ASSEMBLY.md §4-§14 (steps 1-11); every part, fastener and
# consumable named here must have a line in BOM.md.
# parts: {wrapper file: {stl name: material}}; stl name = `part="v3_<name>"` in render_v2/<wrapper>.scad.
# segments: one per installed part / fastener group. add: [{parts, from (fly-in offset mm, relative
#   to `at`), at (rest offset from the assembled position, e.g. a bench spot), delay, dur, spin,
#   spin_axis, split (each loose piece on its own), stagger, n (pieces, for timing)}];
#   move: [{parts, to, delay, dur}] eases earlier parts to a new offset ([0,0,0] = assembled);
#   hide / show: parts off / on from the segment start; no_bench: hide the bench (from-below shots).
# cams: name: [target mm, distance mm, azimuth deg (0 = from the front, -Y; + toward +X), elevation, drift deg/s, f-stop]
title: Riftbound Card Sorter
voice: af_heart
speed: 1.12
floor_z: -16          # bench top = underside of the 10 mm rubber feet
scene_radius: 650
steps:
  1: Baseplate, backing board and tee-nuts
  2: Electronics tray
  3: Conveyor riser
  4: Rails and bearings
  5: Slide bed, belts, rollers, rods, motor mounts
  6: Scan station
  7: Hopper elevator
  8: Pick arm
  9: Sorting tray
  10: Cradle shuttle, load cell, lower ramp, reject bin
  11: Wiring and vacuum

