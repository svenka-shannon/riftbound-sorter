      - {parts: [sh_rbar_neg], at: [0, -10, 170], from: [-50, 0, 30], dur: 0.9}
      - {parts: [sh_rbar_pos], at: [0, -10, 170], from: [-50, 0, 30], delay: 0.5, dur: 0.9}
      - {parts: [sh_rbarscr], at: [0, -10, 170], from: [0, 0, 30], delay: 1.5, dur: 0.8, spin: 2}
  - id: s10_c2a
    step: 10
    caption: "ch2 (after its direction check): round 25T horn; crank on, M3 × 12 hub screw just seated"
    say: "The shuttle servo and horn. The crank goes on with its hub screw just seated."
    cam: sh_c2
    add:
      - {parts: [sh_c2servo], at: [0, -10, 170], from: [0, 0, -60], dur: 1.0}
      - {parts: [sh_c2horn], at: [0, -10, 170], from: [0, 0, -40], delay: 0.8, dur: 0.8}
      - {parts: [sh_c2crank_park], at: [0, -10, 170], from: [0, 0, -40], delay: 1.4, dur: 0.8}
  - id: s10_c2b
    step: 10
    caption: "Crank at ψ 90: 4 × M2 × 6 countersunk, then the hub screw tight; park it at ψ ≈ 100°"
    say: "Line the crank up at ninety degrees, drive the four small screws, tighten the hub screw, and park it."
    add: [{parts: [sh_c2hornscr_park], at: [0, -10, 170], from: [0, 0, -25], dur: 0.8}]
  - id: s10_c2hang
    step: 10
    caption: "Hung under the −Y post's shelf: 2 × M2.5 × 10 rear-ear screws, a turn loose"
    say: "Hang it under the end post, screws a turn loose."
    add: [{parts: [sh_c2ear_rear], at: [0, -10, 170], from: [0, 0, -30], dur: 0.9, spin: 2}]
  - id: s10_place
    step: 10
    caption: "Carriage to column 3, frame level; module down 10 mm toward −Y"
    say: "Carriage to column three, then set the module down."
    cam: sh_place
    hide: [sh_tf, sh_fpins, sh_ptfe, sh_cradle, sh_cell, sh_cellscr_tf, sh_cellscr_cr, sh_sled, sh_lm8uu, sh_dowels, sh_tdrive, sh_pina, sh_cheek_neg, sh_cheek_pos, sh_cheekscr]
    add:
      - {parts: [var_col3_carriage, var_col3_tf, var_col3_cradle, var_col3_steel], at: [0, -10, 170], from: [0, 0, 0], delay: 0.0, dur: 0.05}
    move:
      - {parts: [var_col3_carriage, var_col3_tf, var_col3_cradle, var_col3_steel, sh_post_neg, sh_post_pos, sh_c1servo, sh_c1scr, sh_688, sh_rod, sh_rex, sh_rodscr, sh_rbar_neg, sh_rbar_pos, sh_rbarscr, sh_c2servo, sh_c2horn, sh_c2crank_park, sh_c2hornscr_park, sh_c2ear_rear], to: [0, -10, 0], delay: 0.6, dur: 2.2}
      - {parts: [sh_tf, sh_fpins, sh_ptfe, sh_cradle, sh_cell, sh_cellscr_tf, sh_cellscr_cr, sh_sled, sh_lm8uu, sh_dowels, sh_tdrive, sh_pina, sh_cheek_neg, sh_cheek_pos, sh_cheekscr], to: [0, 0, 0], delay: 0.0, dur: 0.05}
  - id: s10_slide
    step: 10
    caption: "Slide +Y 10 mm: front ear under riser B's block; rear-ear screws tight"
    say: "Slide it back, so the servo ear goes under the riser."
    cam: sh_under
    move:
      - {parts: [var_col3_carriage, sh_post_neg, sh_c1servo, sh_c1scr, sh_688, sh_rod, sh_rex, sh_rodscr, sh_rbar_neg, sh_c2servo, sh_c2horn, sh_c2crank_park, sh_c2hornscr_park, sh_c2ear_rear, var_col3_tf, var_col3_cradle, var_col3_steel, sh_post_pos, sh_rbar_pos, sh_rbarscr], to: [0, 0, 0], delay: 0.3, dur: 1.4}
  - id: s10_frontear
    step: 10
    caption: "Front ear: 2 × M2.5 × 10 up through the riser tunnel"
    say: "Two front-ear screws, from below."
    add: [{parts: [sh_c2ear_front], from: [0, 0, -30], dur: 0.9, spin: 2}]
  - id: s10_anchors
    step: 10
    caption: "End posts: 6 × M3 × 20 into the tee-nuts"
    say: "Six screws hold the end posts."
    cam: sh_place
    add: [{parts: [sh_anchors], split: true, n: 6, stagger: 0.15, from: [0, 0, 50], dur: 0.9, spin: 2}]
  - id: s10_link
    step: 10
    caption: "ch2 link (2 short M3 × 4 inserts in its top): 5 mm shoulder screw at the crank tip, 6 mm at the drive pin (§13.7)"
    say: "The shuttle link and its two shoulder screws."
    cam: sh_link
    hide: [var_col3_carriage, var_col3_tf, var_col3_cradle, var_col3_steel, sh_c2crank_park, sh_c2hornscr_park]
    show: [var_col0_carriage, var_col0_tf, var_col0_cradle, var_col0_steel, var_col0_c2crank]
    add:
      - {parts: [var_col0_c2link], from: [-60, 0, 0], dur: 1.1}
      - {parts: [var_col0_c2pins], from: [0, 0, 30], delay: 1.3, dur: 0.9}
  - id: s10_ramp_neg
    step: 10
    caption: "Carriage at column 3: ramp_neg straight down behind the tray"
    say: "Carriage at column three: the first ramp half."
    cam: sh_ramp
    hide: [var_col0_carriage, var_col0_tf, var_col0_cradle, var_col0_steel, var_col0_c2crank, var_col0_c2link, var_col0_c2pins]
    show: [var_col3_carriage, var_col3_tf, var_col3_cradle, var_col3_steel, var_col3_c2crank, var_col3_c2link, var_col3_c2pins]
    add: [{parts: [sh_ramp_neg], from: [0, 0, 120], dur: 1.3}]
  - id: s10_ramp_pos
    step: 10
    caption: "Column 0: ramp_pos down; 4 × M3 × 20 through the rear tabs"
    say: "At column zero, the second half and four screws."
    hide: [var_col3_carriage, var_col3_tf, var_col3_cradle, var_col3_steel, var_col3_c2crank, var_col3_c2link, var_col3_c2pins]
    show: [var_col0_carriage, var_col0_tf, var_col0_cradle, var_col0_steel, var_col0_c2crank, var_col0_c2link, var_col0_c2pins]
    add:
      - {parts: [sh_ramp_pos], from: [0, 0, 120], dur: 1.3}
      - {parts: [sh_rampscr], split: true, n: 4, stagger: 0.15, from: [0, 0, 40], delay: 1.5, dur: 0.8, spin: 2}
  - id: s10_reject
    step: 10
    caption: "Reject bin beside the tray: 4 × M3 × 18 countersunk"
    say: "The reject bin."
    cam: sh_reject
    add:
      - {parts: [sh_reject], from: [0, 0, 120], dur: 1.3}
      - {parts: [sh_rejectscr], split: true, n: 4, stagger: 0.15, from: [0, 0, 40], delay: 1.5, dur: 0.8, spin: 2}

  # ── Step 11 ──
  - id: s11_power
    step: 11
    caption: "12 V unplugged: jack, 3 fixed 5 V rails, relay, PCA9685, 10 kΩ pull-ups/downs (§14.1)"
    say: "Step eleven. With the power unplugged, wire the tray."
    cam: tray
    hide: [var_col0_carriage, var_col0_tf, var_col0_cradle, var_col0_steel, var_col0_c2crank, var_col0_c2link, var_col0_c2pins]
    show: [sh_tf, sh_fpins, sh_ptfe, sh_cradle, sh_cell, sh_cellscr_tf, sh_cellscr_cr, sh_sled, sh_lm8uu, sh_dowels, sh_tdrive, sh_pina, sh_cheek_neg, sh_cheek_pos, sh_cheekscr, sh_c2crank, sh_c2hornscr, sh_c2link, sh_c2tip, sh_c2drive]
  - id: s11_harness
    step: 11
    caption: "Harness round the hopper into the tray: servo extensions, N20s, hopper leads"
    say: "The harness, round the hopper into the tray."
    cam: wiring
    add: [{parts: [harness], from: [0, 0, 50], dur: 1.2}]
  - id: s11_ribbon
    step: 11
    caption: "Camera ribbon (SC1130) and LED leads over the hood and back rail into the tray"
    say: "The camera ribbon, over the hood."
    cam: scan_back
    add: [{parts: [ribbon], from: [0, 0, 50], dur: 1.1}]
  - id: s11_pbase
    step: 11
    caption: "Pump bracket base: 4 × M3 × 20, before the pump"
    say: "The pump bracket base, before the pump."
    cam: pump
    add:
      - {parts: [pb_base], from: [0, 0, 80], dur: 1.1}
      - {parts: [pb_basescr], split: true, n: 4, stagger: 0.15, from: [0, 0, 40], delay: 1.2, dur: 0.8, spin: 2}
  - id: s11_isolate
    step: 11
    caption: "TPU sleeve (or neoprene strip) on the pump can; head pad in the cradle"
    say: "The isolation sleeve and head pad."
    add:
      - {parts: [pb_sleeve], from: [-60, 0, 30], dur: 1.0}
      - {parts: [pb_pad], from: [0, 0, 40], delay: 0.7, dur: 0.9}
  - id: s11_pump
    step: 11
    caption: "R385 pump in the saddle; cap 2 × M3 × 10; 1N5819 across its terminals"
    say: "The pump and its cap."
    add:
      - {parts: [pb_pump], from: [0, 0, 70], dur: 1.0}
      - {parts: [pb_cap], from: [0, 0, 40], delay: 1.0, dur: 0.8}
      - {parts: [pb_capscr], from: [0, 0, 30], delay: 1.7, dur: 0.8, spin: 2}
      - {parts: [pb_diode], from: [-30, 0, 0], delay: 2.3, dur: 0.7}
  - id: s11_clip
    step: 11
    caption: "Valve clip: 2 × M3 × 20; 1 mm foam-tape strip on its floor"
    say: "The valve clip and a foam strip."
    add:
      - {parts: [pb_clip], from: [0, 0, 60], dur: 1.0}
      - {parts: [pb_clipscr], split: true, n: 2, stagger: 0.2, from: [0, 0, 40], delay: 1.0, dur: 0.8, spin: 2}
      - {parts: [pb_foam], from: [0, 0, 30], delay: 1.9, dur: 0.7}
  - id: s11_valve
    step: 11
    caption: "12 V NC vent valve: line barb +Y, vent barb up; 1N5819 across the coil"
    say: "The vent valve, vent barb up."
    add: [{parts: [pb_valve], from: [0, 0, 50], dur: 1.0}]
  - id: s11_leads
    step: 11
    cam: pump
    caption: "Pump + valve 12 V leads (relay NO1 / NO2) to the harness drop"
    say: "The twelve volt leads."
    add: [{parts: [leads12], from: [0, 0, 30], dur: 1.0}]
  - id: s11_tube
    step: 11
    cam: pump_side
    caption: "Pump inlet (sleeve + reducing barb) › barbed tee › arm; 20 mm silicone tee › valve"
    say: "The vacuum line, through the tee to the arm and the valve."
    add:
      - {parts: [pb_tee], from: [0, 0, 30], dur: 0.8}
      - {parts: [tube_pump], from: [0, 0, 30], delay: 0.7, dur: 0.9}
      - {parts: [tube_branch], from: [0, 0, 20], delay: 1.4, dur: 0.8}
  - id: s11_cell
    step: 11
    caption: "Load-cell lead: 4-core wire, rolling loop under the carriage, into the +X slot"
    say: "And the load-cell lead."
    cam: shuttle
    add: [{parts: [cell_lead], from: [0, 0, 30], dur: 1.0}]

  - id: outro
    title: Mechanical build complete
    subtitle: "Next: software setup and calibration (§15–16)"
    caption: "First runs with bulk commons only (§17)"
    say: "That's the mechanical build. Next, software and calibration, with bulk commons only."
    cam: outro
