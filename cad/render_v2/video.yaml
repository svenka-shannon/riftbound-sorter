# offsets used below: riser bench [0,0,150]; rail bench [0,0,110]; motor-mount bench [0,-150,0];
# hood bench [0,0,170]; camera-bracket bench [0,0,150]; hopper-carriage bench [0,0,190];
# arm bench [0,-140,50]; shuttle module bench [0,-10,170]; tilt-frame bench [0,-10,250]
segments:
  - id: intro
    title: Riftbound Card Sorter
    subtitle: Step-by-step assembly, part by part
    caption: "Before you start: read §19 Known risks, bench-test the MG996Rs (§19.1), print all parts, fit the 50 M3 inserts"
    say: "The Riftbound card sorter, built part by part in build-guide order. Read the known risks, test the servos, then print the parts and fit the inserts."
    cam: intro

  # ── Step 1 ──
  - id: s1_board
    step: 1
    caption: "Backing board: 6 mm plywood or MDF, at least 570 × 540 mm"
    say: "Step one. The six millimetre backing board."
    cam: board
    add: [{parts: [board], from: [0, 0, 160], dur: 1.4}]
  - id: s1_tiles
    step: 1
    caption: "9 baseplate tiles, 3 × 3, all the same way round; number them underneath"
    say: "Nine baseplate tiles, three by three, all the same way round."
    add:
      - {parts: [tile0], from: [0, 0, 90], delay: 0.1, dur: 0.9}
      - {parts: [tile1], from: [0, 0, 90], delay: 0.35, dur: 0.9}
      - {parts: [tile2], from: [0, 0, 90], delay: 0.6, dur: 0.9}
      - {parts: [tile3], from: [0, 0, 90], delay: 0.85, dur: 0.9}
      - {parts: [tile4], from: [0, 0, 90], delay: 1.1, dur: 0.9}
      - {parts: [tile5], from: [0, 0, 90], delay: 1.35, dur: 0.9}
      - {parts: [tile6], from: [0, 0, 90], delay: 1.6, dur: 0.9}
      - {parts: [tile7], from: [0, 0, 90], delay: 1.85, dur: 0.9}
      - {parts: [tile8], from: [0, 0, 90], delay: 2.1, dur: 0.9}
  - id: s1_keys
    step: 1
    caption: "24 bow-tie keys pressed into the seam pockets"
    say: "Twenty-four bow-tie keys lock the seams."
    cam: board_close
    add: [{parts: [keys], split: true, n: 24, stagger: 0.06, from: [0, 0, 40], dur: 0.7}]
  - id: s1_drill
    step: 1
    caption: "Tiles as template: drill Ø3.4 through tile + board at the 49 holes of §4 (red)"
    say: "Drill the forty-nine listed holes, through tile and board."
    add: [{parts: [holemarks], split: true, n: 49, stagger: 0.04, from: [0, 0, 25], dur: 0.5}]
  - id: s1_teenuts
    step: 1
    caption: "Tiles off, board over: open the 49 holes to Ø4.5, tap in 49 M3 tee-nuts"
    say: "From below, tap an M three tee-nut into every hole."
    cam: below
    no_bench: true
    hide: [holemarks]
    add: [{parts: [teenuts], split: true, n: 49, stagger: 0.04, from: [0, 0, -45], dur: 0.6}]
  - id: s1_feet
    step: 1
    caption: "Tiles + keys back on; 8 rubber feet (≥ 10 mm tall) under the board"
    say: "Tiles back on, then eight rubber feet underneath."
    no_bench: true
    add: [{parts: [feet], split: true, n: 8, stagger: 0.15, from: [0, 0, -70], dur: 0.9}]

  # ── Step 2 ──
  - id: s2_tray
    step: 2
    caption: "Electronics tray against the riser line (Y 80): 4 × M3 × 18 SHCS"
    say: "Step two. The electronics tray, with four M three by eighteen screws."
    cam: tray
    add:
      - {parts: [etray], from: [0, 80, 160], dur: 1.5}
      - {parts: [etray_screws], split: true, n: 4, stagger: 0.15, from: [0, 0, 45], delay: 1.5, dur: 0.9, spin: 2}
  - id: s2_jack
    step: 2
    caption: "Panel barrel jack (M8 thread) in the back wall"
    say: "The barrel jack in the back wall."
    add: [{parts: [jack], from: [0, 60, 0], dur: 1.0}]
  - id: s2_pi
    step: 2
    caption: "Pi Zero 2 W, CSI connector toward +X: 4 × M2.5 self-tappers"
    say: "The Pi Zero, camera connector toward the shuttle."
    cam: tray_close
    add:
      - {parts: [pi, pi_chips], from: [0, 0, 70], dur: 1.1}
      - {parts: [pi_scr], from: [0, 0, 25], delay: 1.2, dur: 0.8, split: true, n: 4, stagger: 0.12, spin: 2}
  - id: s2_pca
    step: 2
    caption: "PCA9685 servo board: 4 × M2.5 self-tappers"
    say: "The P C A ninety-six eighty-five servo board."
    add:
      - {parts: [pca, pca_chips], from: [0, 0, 70], dur: 1.1}
      - {parts: [pca_scr], from: [0, 0, 25], delay: 1.2, dur: 0.8, split: true, n: 4, stagger: 0.12, spin: 2}
  - id: s2_relay
    step: 2
    caption: "2-channel 5 V relay (pump, vent valve): 4 × M2.5 self-tappers"
    say: "The two-channel relay."
    add:
      - {parts: [rly, rly_chips], from: [0, 0, 70], dur: 1.1}
      - {parts: [rly_scr], from: [0, 0, 25], delay: 1.2, dur: 0.8, split: true, n: 4, stagger: 0.12, spin: 2}
  - id: s2_uln
    step: 2
    caption: "ULN2003 stepper driver: 4 × M2.5 self-tappers"
    say: "The stepper driver board."
    add:
      - {parts: [uln, uln_chips], from: [0, 0, 70], dur: 1.1}
      - {parts: [uln_scr], from: [0, 0, 25], delay: 1.2, dur: 0.8, split: true, n: 4, stagger: 0.12, spin: 2}
  - id: s2_hxl9
    step: 2
    caption: "HX711 + L9110S in their pockets on 1 mm foam tape"
    say: "The load-cell amp and motor driver, on foam tape."
    add:
      - {parts: [foam], from: [0, 0, 30], dur: 0.8}
      - {parts: [hxl9, hxl9_chips], from: [0, 0, 60], delay: 0.9, dur: 1.0}
  - id: s2_pol
    step: 2
    caption: "3 fixed 5 V Pololu regulators (logic, servo, motor): 2 × M2 self-tappers each"
    say: "Three fixed five volt regulators."
    add:
      - {parts: [pol, pol_chips], from: [0, 0, 60], dur: 1.1}
      - {parts: [pol_scr], from: [0, 0, 20], delay: 1.2, dur: 0.8, spin: 2}
  - id: s2_wago
    step: 2
    caption: "Wago lever connectors + 3 × 1000 µF capacitors on the free floor"
    say: "Wago connectors and three capacitors."
    cam: tray
    add:
      - {parts: [wago, wago_lev], from: [0, 0, 60], dur: 1.0}
      - {parts: [caps], from: [0, 0, 60], delay: 0.8, dur: 1.0}

  # ── Step 3 ──
  - id: s3_riser_a
    step: 3
    caption: "Riser A (X −165..−40) with its front tie tab"
    say: "Step three. Riser A."
    cam: riser_bench
    add: [{parts: [riser_a], at: [0, 0, 150], from: [-80, 0, 60], dur: 1.4}]
  - id: s3_riser_b
    step: 3
    caption: "Riser B against it: 3 × M3 × 12 + nut through the joint walls"
    say: "Riser B, bolted at the joint with three screws and nuts."
    add:
      - {parts: [riser_b], at: [0, 0, 150], from: [90, 0, 0], dur: 1.3}
      - {parts: [riser_joint], at: [0, 0, 150], from: [-40, 0, -40], delay: 1.4, dur: 1.0, spin: 2, spin_axis: x}
  - id: s3_tie
    step: 3
    caption: "Front tie: 2 × M3 × 10 countersunk into riser B's inserts"
    say: "Two countersunk screws through the front tie."
    add: [{parts: [riser_tie], at: [0, 0, 150], from: [0, -40, 0], dur: 1.0, spin: 2, spin_axis: y}]
  - id: s3_place
    step: 3
    caption: "Riser on the baseplate, deck up; keep the tunnel under riser B empty"
    say: "Set the riser on the baseplate. Keep the tunnel empty."
    cam: riser
    move: [{parts: [riser_a, riser_b, riser_joint, riser_tie], to: [0, 0, 0], dur: 1.8}]
  - id: s3_anchor
    step: 3
    caption: "Before the conveyor: 5 × M3 × 20 anchors down the wells into the tee-nuts"
    say: "Five anchor screws down the wells, before the conveyor."
    cam: riser_top
    add: [{parts: [riser_anchors], split: true, n: 5, stagger: 0.2, from: [0, 0, 90], dur: 1.2, spin: 3}]

  # ── Step 4 ──
  - id: s4_halves
    step: 4
    caption: "4 rail halves; the front pair (with insert pads) is the motor rail"
    say: "Step four. Four rail halves. The front pair is the motor rail."
    cam: rails_bench
    add:
      - {parts: [rail_back1], at: [0, 0, 110], from: [0, 90, 40], dur: 1.0}
      - {parts: [rail_back2], at: [0, 0, 110], from: [0, 90, 40], delay: 0.4, dur: 1.0}
      - {parts: [rail_front1], at: [0, 0, 110], from: [0, -90, 40], delay: 0.8, dur: 1.0}
      - {parts: [rail_front2], at: [0, 0, 110], from: [0, -90, 40], delay: 1.2, dur: 1.0}
  - id: s4_bearings
    step: 4
    caption: "A 608ZZ into each rail boss, pressed on the outer ring only"
    say: "A six-oh-eight bearing in each boss."
    add:
      - {parts: [bearings_f], at: [0, 0, 110], from: [0, -60, 0], dur: 1.0, split: true, n: 2, stagger: 0.3}
      - {parts: [bearings_b], at: [0, 0, 110], from: [0, 60, 0], delay: 0.6, dur: 1.0, split: true, n: 2, stagger: 0.3}
  - id: s4_place
    step: 4
    caption: "Join the halves; rails on the deck at Y ±45, bosses out"
    say: "Join the halves and stand the rails on the deck."
    cam: rails
    move: [{parts: [rail_back1, rail_back2, rail_front1, rail_front2, bearings_f, bearings_b], to: [0, 0, 0], dur: 1.6}]
  - id: s4_through
    step: 4
    caption: "4 through-feet: M3 × 80 into the tee-nuts (or 85 mm threaded rod, washer + nut)"
    say: "Four M three by eighty through-bolts."
