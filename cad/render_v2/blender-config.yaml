# PROPOSED replacement for cad/render_v2/blender-config.yaml (Nov 11 redesign).
# Part names = render_v2/parts.scad `part` values; step ids = render_v2/narration.yaml ids.
#   ~/.claude/skills/cad/scripts/cad-blender-assembly render blender-config.yaml /tmp/rv2/frames
stl_dir: /tmp/rv2/stl            # from export_stls.sh
timeline: /tmp/rv2/audio/timeline.json
scene_radius: 650                # mm; scales bench + light rig
floor_z: -12                     # bench top (mm), under the MDF board
parts:
  mdf: mdf
  etray: "petg:#3B3E43"
  pcb_green: pcb
  pcb_blue: "pcb:#1E4C98"
  standoffs: brass
  chips: chip
  riser: "petg:#5C6B7A"
  rails: "petg:#E2742B"
  bearings: steel
  motor_mounts: "petg:#E2742B"
  motors: alu
  slidebed: "petg:#E9E7E2"
  rollers: "petg:#E9E7E2"
  rods: steel
  belts: rubber
  collars: alu
  guides: petg_matte
  hood: petg_matte
  cam_bracket: petg_matte
  camera: pcb
  hopper: "petg:#2E78C9"
  hopper_steel: steel
  hopper_motor: alu
  hopper_switches: chip
  cards: "petg:#F2EBDD"
  arm_tower: "petg:#3B3E43"
  arm_head: "petg:#3B3E43"
  arm_servo: chip
  arm: "petg:#C73A3F"
  arm_bolts: screw
  sorttray: "petg:#3A9E95"
  sh_frame: "petg:#B07A45"
  sh_steel: steel
  sh_servos: chip
  sh_carriage: "petg:#2E78C9"
  sh_cradle: "petg:#F0BE2A"
  loadcell: alu
  c2_drive: "petg:#F0BE2A"
  ramp: "petg:#B07A45"
  reject: "petg:#C73A3F"
  pump: chip
  tube: "rubber:#7FB8E6"
  harness: rubber
  ribbon: "petg:#E8D9A0"
  tile0: "petg:#A4A7A9"
  tile1: "petg:#A4A7A9"
  tile2: "petg:#A4A7A9"
  tile3: "petg:#A4A7A9"
  tile4: "petg:#A4A7A9"
  tile5: "petg:#A4A7A9"
  tile6: "petg:#A4A7A9"
  tile7: "petg:#A4A7A9"
  tile8: "petg:#A4A7A9"
movers:   # offset mm from home; delay/dur s after the step's speech starts; spin = turns (screws)
  - {step: baseplate, parts: [tile0], offset: [0, 0, 110], delay: .15, dur: 1.1}
  - {step: baseplate, parts: [tile1], offset: [0, 0, 110], delay: .47, dur: 1.1}
  - {step: baseplate, parts: [tile2], offset: [0, 0, 110], delay: .79, dur: 1.1}
  - {step: baseplate, parts: [tile3], offset: [0, 0, 110], delay: 1.11, dur: 1.1}
  - {step: baseplate, parts: [tile4], offset: [0, 0, 110], delay: 1.43, dur: 1.1}
  - {step: baseplate, parts: [tile5], offset: [0, 0, 110], delay: 1.75, dur: 1.1}
  - {step: baseplate, parts: [tile6], offset: [0, 0, 110], delay: 2.07, dur: 1.1}
  - {step: baseplate, parts: [tile7], offset: [0, 0, 110], delay: 2.39, dur: 1.1}
  - {step: baseplate, parts: [tile8], offset: [0, 0, 110], delay: 2.71, dur: 1.1}
  - {step: electronics, parts: [etray], offset: [0, 40, 150], delay: 0.2, dur: 1.8}
  - {step: electronics, parts: [standoffs], offset: [0, 0, 45], delay: 2.6, dur: 1.0}
  - {step: electronics, parts: [pcb_green, pcb_blue, chips], offset: [0, 0, 70], delay: 4.2, dur: 1.6}
  - {step: riser, parts: [riser], offset: [0, 0, 150], delay: 0.3, dur: 2.2}
  - {step: rails, parts: [bearings], split: true, offset: [0, 0, 90], delay: 0.2, stagger: 0.3, dur: 1.2}
  - {step: rails, parts: [rails], split: true, sort_axis: y, mirror: y, offset: [0, 90, 120], delay: 1.6, stagger: 1.2, dur: 1.8}
  - {step: rails, parts: [motor_mounts, motors], split: true, offset: [0, -110, 0], delay: 5.0, stagger: 0.6, dur: 1.4}
  - {step: belts, parts: [slidebed], offset: [0, 0, 110], delay: 0.2, dur: 1.4}
  - {step: belts, parts: [belts, rollers], split: true, offset: [0, 0, 90], delay: 1.8, stagger: 0.4, dur: 1.4}
  - {step: belts, parts: [rods], split: true, offset: [0, -190, 0], delay: 4.0, stagger: 0.6, dur: 2.0}
  - {step: belts, parts: [collars], split: true, offset: [0, 0, 40], delay: 6.0, stagger: 0.2, dur: 1.0}
  - {step: scan, parts: [guides], split: true, offset: [0, 0, 60], delay: 0.2, stagger: 0.4, dur: 1.2}
  - {step: scan, parts: [hood], offset: [0, 0, 150], delay: 2.0, dur: 2.0}
  - {step: scan, parts: [cam_bracket, camera], offset: [0, -60, 140], delay: 4.4, dur: 2.0}
  - {step: hopper, parts: [hopper, hopper_steel, hopper_motor, hopper_switches, cards], offset: [-150, 0, 40], delay: 0.3, dur: 2.4}
  - {step: arm, parts: [arm_tower], offset: [0, -60, 160], delay: 0.2, dur: 1.4}
  - {step: arm, parts: [arm_head, arm_servo, arm], offset: [0, 0, 110], delay: 1.8, dur: 1.6}
  - {step: arm, parts: [arm_bolts], split: true, offset: [0, 0, 24], delay: 3.8, stagger: 0.4, dur: 1.2, spin: 3}
  - {step: tray, parts: [sorttray], offset: [190, 0, 20], delay: 0.3, dur: 2.4}
  - {step: sorter, parts: [sh_frame, sh_steel, sh_servos], offset: [0, 0, 120], delay: 0.2, dur: 1.6}
  - {step: sorter, parts: [sh_carriage, sh_cradle, loadcell, c2_drive], offset: [0, 0, 110], delay: 2.0, dur: 1.6}
  - {step: sorter, parts: [ramp, reject], split: true, offset: [120, 0, 40], delay: 5.5, stagger: 0.5, dur: 1.4}
  - {step: wiring, parts: [pump, tube], offset: [0, -60, 40], delay: 0.2, dur: 1.4}
  - {step: wiring, parts: [harness], offset: [0, 0, 60], delay: 1.8, dur: 1.6}
  - {step: wiring, parts: [ribbon], offset: [0, 0, 60], delay: 3.6, dur: 1.4}
# segment id: [target mm, distance mm, azimuth deg (0 = front/-Y), elevation deg, azimuth drift deg/s, f-stop]
cameras:
  intro:       [[0, 0, 80], 1050, -40, 30, 5.0, 11]
  baseplate:   [[0, 0, 0], 1250, -15, 48, 1.2, 11]
  electronics: [[-60, 140, 20], 520, 8, 44, 1.0, 8]
  riser:       [[-40, -20, 35], 680, -28, 34, 1.2, 9]
  rails:       [[-40, 0, 80], 720, -28, 34, 1.2, 9]
  belts:       [[-45, -10, 82], 560, -42, 28, 1.0, 9]
  scan:        [[5, 0, 150], 620, -18, 30, 1.0, 9]
  hopper:      [[-215, 0, 90], 600, -55, 26, 1.0, 9]
  arm:         [[-160, -80, 120], 680, -38, 22, 1.0, 9]
  tray:        [[227, 0, 70], 720, -32, 26, 1.0, 9]
  sorter:      [[130, 0, 60], 700, -35, 30, 1.0, 9]
  wiring:      [[-60, 0, 60], 1100, -35, 45, 2.0, 11]
  outro:       [[0, 0, 80], 1050, -30, 30, 7.0, 11]
