# cad-blender-assembly config for the Riftbound sorter (same scene as render_blender.py).
#   ~/.claude/skills/cad/scripts/cad-blender-assembly render blender-config.yaml /tmp/rv2/frames
stl_dir: /tmp/rv2/stl            # from export_stls.sh
timeline: /tmp/rv2/audio/timeline.json
scene_radius: 600                # mm; scales bench + light rig
floor_z: -12                     # bench top (mm), under the MDF board
parts:
  mdf: mdf
  etray: "petg:#3B3E43"
  pcb_green: pcb
  pcb_blue: "pcb:#1E4C98"
  standoffs: brass
  chips: chip
  rails: "petg:#E2742B"
  rollers: "petg:#E9E7E2"
  rods: steel
  orings: rubber
  hopper: "petg:#2E78C9"
  armpost: alu
  arm: "petg:#C73A3F"
  arm_bolts: screw
  cup: rubber
  hood: petg_matte
  loadcell: alu
  lc_mount: "petg:#3B3E43"
  lc_bolts: screw
  sorttray: "petg:#3A9E95"
  levers: "petg:#F0BE2A"
  lever_screws: screw
  tile0: "petg:#A4A7A9"
  tile1: "petg:#A4A7A9"
  tile2: "petg:#A4A7A9"
  tile3: "petg:#A4A7A9"
  tile4: "petg:#A4A7A9"
  tile5: "petg:#A4A7A9"
  tile6: "petg:#A4A7A9"
  tile7: "petg:#A4A7A9"
  tile8: "petg:#A4A7A9"
movers:   # offset mm from home; delay/dur s after the step's speech starts; spin = turns (screws)
  - {step: baseplate, parts: [tile0], offset: [0, 0, 110], delay: .15, dur: 1.1}
  - {step: baseplate, parts: [tile1], offset: [0, 0, 110], delay: .47, dur: 1.1}
  - {step: baseplate, parts: [tile2], offset: [0, 0, 110], delay: .79, dur: 1.1}
  - {step: baseplate, parts: [tile3], offset: [0, 0, 110], delay: 1.11, dur: 1.1}
  - {step: baseplate, parts: [tile4], offset: [0, 0, 110], delay: 1.43, dur: 1.1}
  - {step: baseplate, parts: [tile5], offset: [0, 0, 110], delay: 1.75, dur: 1.1}
  - {step: baseplate, parts: [tile6], offset: [0, 0, 110], delay: 2.07, dur: 1.1}
  - {step: baseplate, parts: [tile7], offset: [0, 0, 110], delay: 2.39, dur: 1.1}
  - {step: baseplate, parts: [tile8], offset: [0, 0, 110], delay: 2.71, dur: 1.1}
  - {step: electronics, parts: [etray], offset: [0, 40, 150], delay: 0.2, dur: 1.8}
  - {step: electronics, parts: [standoffs], offset: [0, 0, 45], delay: 2.6, dur: 1.0}
  - {step: electronics, parts: [pcb_green, pcb_blue, chips], offset: [0, 0, 70], delay: 4.2, dur: 1.6}
  - {step: rails, parts: [rails], split: true, sort_axis: y, mirror: y, offset: [0, 90, 120], delay: 0.3, stagger: 1.4, dur: 1.8}
  - {step: rollers, parts: [rollers, orings], split: true, offset: [0, 0, 90], delay: 0.2, stagger: 0.5, dur: 1.4}
  - {step: rollers, parts: [rods], split: true, offset: [0, -190, 0], delay: 2.4, stagger: 0.6, dur: 2.0}
  - {step: hopper, parts: [hopper], offset: [-150, 0, 40], delay: 0.3, dur: 2.4}
  - {step: arm, parts: [armpost], offset: [0, 0, 160], delay: 0.2, dur: 1.4}
  - {step: arm, parts: [arm, cup], offset: [0, 0, 110], delay: 1.8, dur: 1.6}
  - {step: arm, parts: [arm_bolts], split: true, offset: [0, 0, 24], delay: 3.8, stagger: 0.5, dur: 1.3, spin: 3}
  - {step: hood, parts: [hood], offset: [0, 0, 150], delay: 0.3, dur: 2.2}
  - {step: loadcell, parts: [loadcell, lc_mount], offset: [0, 0, 70], delay: 0.2, dur: 1.4}
  - {step: loadcell, parts: [lc_bolts], split: true, offset: [0, 0, 20], delay: 2.0, stagger: 0.6, dur: 1.4, spin: 2.25}
  - {step: tray, parts: [sorttray], offset: [190, 0, 20], delay: 0.3, dur: 2.4}
  - {step: gates, parts: [levers], split: true, offset: [0, 0, 60], delay: 0.2, stagger: 0.45, dur: 1.1}
  - {step: gates, parts: [lever_screws], split: true, offset: [0, 0, 18], delay: 2.0, stagger: 0.45, dur: 1.1, spin: 3}
# segment id: [target mm, distance mm, azimuth deg (0 = front/-Y), elevation deg, azimuth drift deg/s, f-stop]
cameras:
  intro:       [[0, 0, 50], 980, -40, 30, 5.0, 11]
  baseplate:   [[0, 0, 0], 1250, -15, 48, 1.2, 11]
  electronics: [[-60, 140, 20], 520, 8, 44, 1.0, 8]
  rails:       [[-40, 0, 25], 720, -28, 34, 1.2, 9]
  rollers:     [[-45, -10, 22], 560, -42, 28, 1.0, 9]
  hopper:      [[-205, -10, 50], 560, -55, 26, 1.0, 9]
  arm:         [[-235, 0, 80], 640, -38, 22, 1.0, 9]
  hood:        [[-5, 0, 70], 560, -18, 32, 1.0, 9]
  loadcell:    [[20, 146, 48], 260, 158, 52, 0.8, 8]
  tray:        [[120, 0, 60], 720, -32, 26, 1.0, 9]
  gates:       [[52, 40, 44], 250, 0, 62, 0.8, 8]
  outro:       [[0, 0, 50], 1020, -30, 30, 7.0, 11]
