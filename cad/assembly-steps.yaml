# Riftbound Card Sorter — assembly video steps (Nov 11 redesign build order)
# Quick OpenSCAD preview of the build steps (not the published video: that is the narrated,
# part-by-part docs/assembly-video-v3.mp4, built by cad/render_v2/make_video.py from video.yaml):
#   ~/.claude/skills/cad/scripts/cad-assembly-video cad/assembly.scad \
#       --steps cad/assembly-steps.yaml --out /tmp/assembly-preview.mp4 --keyframes /tmp/kf
# Every part module lives in assembly.scad (asm_*), already at its assembled position.
# Moving parts are shown at HOME: arm parked (servo 90), hopper plate at the bottom,
# shuttle at home / level (the load-cell loop is drawn for the home carriage Y 0).
# Fastener lengths follow the part files' BOM footers: baseplate screws go into
# board tee-nuts (baseplate_tile.scad; washer + nut under the board is the
# fallback), length ≥ clamp + 4 mm.
title: "Riftbound Card Sorter - mechanical assembly"
seconds_per_step: 3.5
fly_fraction: 0.6
explode_distance: 110
mode: use
colorscheme: Tomorrow
camera: {rot: [58, 0, 20], zoom: 1.45}
steps:
  - caption: "Baseplate: 9 tiles on the 6 mm board, 24 bow-tie keys in the seams (optional M3 x 16 tile clamps)"
    part: asm_baseplate()
    color: "#E8D9A0"
    explode: "+z 70"
    intro_explode: [0, 0, 0]

  - caption: "Electronics tray behind the riser, 4x M3 x 18; boards on the printed posts and pockets"
    part: asm_electronics_tray()
    color: "#5FCB8A"
    explode: "+z"
    intro_explode: [0, 110, 170]

  - caption: "60 mm riser (2 prints: 3x M3 x 12 + 2x M3 x 10 csk) onto the baseplate, 5 anchors M3 x 20"
    part: asm_deck_riser()
    color: "#8A9BB0"
    explode: "+z 90"
    intro_explode: [0, -40, 200]

  - caption: "Rails on the riser deck: 4 through-feet M3 x 80, 2 insert feet M3 x 10; 608 bearings in the bosses"
    parts: ["asm_rails()", "asm_bearings()"]
    color: "#F5A65B"
    explode: [0, -120, 60]
    intro_explode: [0, -60, 230]

  - caption: "Slide bed + 4 O-ring belts, rollers on 8 mm rods, collars; then N20 motor mounts on the front rail (M3 x 10 BHCS)"
    parts: ["asm_slide_bed()", "asm_belts()", "asm_rollers()", "asm_rods()", "asm_collars()", "asm_motor_mounts()", "asm_motors()"]
    color: "#B8B8B8"
    explode: "+z 90"
    intro_explode: [0, 0, 260]

  - caption: "Scan station: card guides + clips, light hood, camera bracket on the front rail feet (M3 x 16)"
    part: asm_scan()
    color: "#8E9AA6"
    explode: "+z"
    intro_explode: [0, -60, 300]

  - caption: "Hopper elevator at the belt inlet, 4x M3 x 20 countersunk; 28BYJ-48 lead-screw tower to the back"
    part: asm_hopper_lift()
    color: "#6FB3E8"
    explode: "-x 120"
    intro_explode: [-80, 0, 200]

  - caption: "Pick arm tower on the front edge, 4x M3 x 20; MG996R to ch0"
    part: asm_arm()
    color: "#F0626B"
    explode: "-y 120"
    intro_explode: [-60, -230, 200]

  - caption: "2-floor sorting tray at X 178..276: 8x M3 x 18 csk to the board, 8x M3 x 12 csk stacking"
    part: asm_sorting_tray()
    color: "#A99BF0"
    explode: "+x"
    intro_explode: [160, 0, 170]

  - caption: "Cradle shuttle + load cell (ch1 tilt, ch2 shuttle), end posts 6x M3 x 20, lower ramp, reject bin"
    part: asm_sorter()
    color: "#FFD43B"
    explode: "+z 100"
    intro_explode: [120, 0, 260]

  - caption: "Pump bracket 4x + valve clip 2x M3 x 20; tee + NC vent valve in the vacuum line; harness, FFC, load-cell loop"
    part: asm_wiring()
    color: "#3A3A3A"
    explode: "+z 60"
    intro_explode: [-60, 0, 320]

outro: {spin: true, seconds: 5, zoom: 1.4, caption: "Assembly complete - 8 sort slots, 2 floors + reject bin"}
