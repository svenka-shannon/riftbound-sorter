<rect x="310" y="250" width="300" height="88" rx="6" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
<text x="320" y="270" class="h" text-anchor="start">Reg #1  Pololu D24V22F5</text>
<text x="320" y="286" class="s" text-anchor="start">fixed output, EN open</text>
<text x="320" y="302" class="p" text-anchor="start">5 V 2.5 A  —  5 V LOGIC</text>
<text x="320" y="317" class="p" text-anchor="start">≈ 1.3 A: Pi, camera, LEDs, 2-ch relay</text>
<rect x="310" y="370" width="300" height="88" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="320" y="390" class="h" text-anchor="start">Reg #2  Pololu D24V50F5</text>
<text x="320" y="406" class="s" text-anchor="start">fixed output, EN open</text>
<text x="320" y="422" class="p" text-anchor="start">5 V 5 A  —  5 V SERVO</text>
<text x="320" y="437" class="p" text-anchor="start">PCA9685 V+ only, peak ≈ 4 A</text>
<text x="320" y="452" class="p" text-anchor="start">1000 µF at output</text>
<rect x="310" y="490" width="300" height="88" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
<text x="320" y="510" class="h" text-anchor="start">Reg #3  Pololu D36V28F5</text>
<text x="320" y="526" class="s" text-anchor="start">fixed output, EN open</text>
<text x="320" y="542" class="p" text-anchor="start">5 V 3.2 A  —  5 V MOTOR</text>
<text x="320" y="557" class="p" text-anchor="start">L9110S + ULN2003, ≤ 3.2 A</text>
<text x="320" y="572" class="p" text-anchor="start">1000 µF at output</text>
<path d="M290,290 L310,290" fill="none" stroke="#f85149" stroke-width="2.2"/>
<text x="292" y="286" class="w" text-anchor="start">VIN</text>
<path d="M290,410 L310,410" fill="none" stroke="#f85149" stroke-width="2.2"/>
<text x="292" y="406" class="w" text-anchor="start">VIN</text>
<path d="M290,530 L310,530" fill="none" stroke="#f85149" stroke-width="2.2"/>
<text x="292" y="526" class="w" text-anchor="start">VIN</text>
<rect x="310" y="630" width="300" height="146" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="320" y="650" class="h" text-anchor="start">Relay 2-ch, 5 V (active LOW)</text>
<text x="320" y="668" class="p" text-anchor="start">VCC ← 5 V logic    GND ← GND</text>
<text x="320" y="683" class="p" text-anchor="start">IN1 ← GPIO 17 (LOW = pump ON)</text>
<text x="320" y="698" class="p" text-anchor="start">IN2 ← GPIO 27 (LOW = vent OPEN)</text>
<text x="320" y="713" class="p" text-anchor="start">COM1, COM2 ← 12 V</text>
<text x="320" y="728" class="p" text-anchor="start">NO1 → pump +    NO2 → valve +</text>
<text x="320" y="743" class="p" text-anchor="start">10 kΩ GPIO 17, 27 → 3.3 V (pull-ups)</text>
<text x="320" y="762" class="warn" text-anchor="start">bench-check: OFF at IN = 3.3 V</text>
<path d="M290,713 L310,713" fill="none" stroke="#f85149" stroke-width="2.2"/>
<text x="292" y="707" class="w" text-anchor="start">COM</text>
<rect x="310" y="790" width="300" height="92" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="320" y="810" class="h" text-anchor="start">12 V R385 diaphragm pump</text>
<text x="320" y="828" class="p" text-anchor="start">+ ← relay NO1,  − → GND</text>
<text x="320" y="843" class="p" text-anchor="start">1N5819/1N4007 across the pump</text>
<text x="320" y="858" class="p" text-anchor="start">(cathode/stripe to +)</text>
<text x="320" y="873" class="p" text-anchor="start">inlet → tee → 4 mm tube → cup</text>
<path d="M460,776 L460,790" fill="none" stroke="#f85149" stroke-width="2.2"/>
<text x="466" y="788" class="w" text-anchor="start">NO1</text>
<rect x="20" y="790" width="250" height="106" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="30" y="810" class="h" text-anchor="start">12 V vent valve (NC)</text>
<text x="30" y="828" class="p" text-anchor="start">mini solenoid, normally closed</text>
<text x="30" y="843" class="p" text-anchor="start">+ ← relay NO2,  − → GND</text>
<text x="30" y="858" class="p" text-anchor="start">1N5819 across the coil (stripe +)</text>
<text x="30" y="873" class="p" text-anchor="start">teed into the vacuum line;</text>
<text x="30" y="888" class="p" text-anchor="start">energised = open to air (0.4 s)</text>
<path d="M340,776 L340,782 L145,782 L145,790" fill="none" stroke="#f85149" stroke-width="2.2"/>
<text x="150" y="779" class="w" text-anchor="start">NO2</text>
