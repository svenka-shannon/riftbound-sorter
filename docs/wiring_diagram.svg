<text x="1170" y="148" class="p" text-anchor="start">      + 1000 µF across V+ / GND</text>
<text x="1170" y="163" class="p" text-anchor="start">SDA ← GPIO 2    SCL ← GPIO 3</text>
<text x="1170" y="178" class="p" text-anchor="start">pulses 500–2500 µs; ch3–15 unused</text>
