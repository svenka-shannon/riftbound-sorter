<text x="30" y="930" class="h" text-anchor="start">LED strips 2 × 88 mm</text>
<text x="30" y="948" class="p" text-anchor="start">5 V COB, in the hood bands</text>
<text x="30" y="963" class="p" text-anchor="start">+ ← 5 V logic (always on)</text>
