<text x="700" y="1000" class="lg" text-anchor="start">GND: every module, regulator, servo and the pump return to one GND bus (not drawn).</text>
<text x="700" y="1020" class="warn" text-anchor="start">Never tie regulator outputs together · never power V+ from the Pi · no micro-USB while Reg #1 is connected.</text>
<text x="700" y="1040" class="lg" text-anchor="start">Safe levels when no program drives the pins: GPIO 17, 27 pulled HIGH (pump off, vent closed), GPIO 23–26 pulled LOW (belt coasts).</text>
