<rect x="700" y="90" width="340" height="620" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="710" y="110" class="h" text-anchor="start">Raspberry Pi Zero 2 W</text>
<text x="710" y="126" class="s" text-anchor="start">electronics tray, front strip, CSI toward +X</text>
<text x="710" y="142" class="p" text-anchor="start">BCM (pin)    function</text>
<text x="710" y="157" class="p" text-anchor="start">5V  (2,4)    ← Reg #1 5 V logic</text>
<text x="710" y="172" class="p" text-anchor="start">3V3 (1,17)   → PCA9685 VCC, HX711 VCC,</text>
<text x="710" y="187" class="p" text-anchor="start">               10 kΩ pull-ups on GPIO 17, 27</text>
<text x="710" y="202" class="p" text-anchor="start">GND (6,9,14,20,25,30,34,39) → GND bus</text>
<text x="710" y="217" class="p" text-anchor="start"></text>
<text x="710" y="232" class="p" text-anchor="start">GPIO 2  (3)  SDA → PCA9685</text>
<text x="710" y="247" class="p" text-anchor="start">GPIO 3  (5)  SCL → PCA9685</text>
<text x="710" y="262" class="p" text-anchor="start"></text>
<text x="710" y="277" class="p" text-anchor="start">GPIO 5  (29) ← HX711 DOUT (DAT)</text>
<text x="710" y="292" class="p" text-anchor="start">GPIO 6  (31) → HX711 SCK  (CLK)</text>
<text x="710" y="307" class="p" text-anchor="start"></text>
<text x="710" y="322" class="p" text-anchor="start">GPIO 17 (11) → relay IN1 pump  [10k↑]</text>
<text x="710" y="337" class="p" text-anchor="start">GPIO 27 (13) → relay IN2 vent  [10k↑]</text>
<text x="710" y="352" class="p" text-anchor="start">GPIO 23 (16) → L9110S A-1A  [10k↓]</text>
<text x="710" y="367" class="p" text-anchor="start">GPIO 24 (18) → L9110S A-1B  [10k↓]</text>
<text x="710" y="382" class="p" text-anchor="start">GPIO 25 (22) → L9110S B-1A  [10k↓]</text>
<text x="710" y="397" class="p" text-anchor="start">GPIO 26 (37) → L9110S B-1B  [10k↓]</text>
<text x="710" y="412" class="p" text-anchor="start"></text>
<text x="710" y="427" class="p" text-anchor="start">GPIO 16 (36) → ULN2003 IN1</text>
<text x="710" y="442" class="p" text-anchor="start">GPIO 19 (35) → ULN2003 IN2</text>
<text x="710" y="457" class="p" text-anchor="start">GPIO 20 (38) → ULN2003 IN3</text>
<text x="710" y="472" class="p" text-anchor="start">GPIO 21 (40) → ULN2003 IN4</text>
<text x="710" y="487" class="p" text-anchor="start"></text>
<text x="710" y="502" class="p" text-anchor="start">GPIO 12 (32) ← top-of-stack switch</text>
<text x="710" y="517" class="p" text-anchor="start">GPIO 13 (33) ← home switch</text>
<!-- PENDING code round 2: switch contact (NO/NC) and active level -->
<text x="710" y="532" class="p" text-anchor="start">               (C → GND, internal pull-ups)</text>
<text x="710" y="547" class="p" text-anchor="start"></text>
<text x="710" y="562" class="p" text-anchor="start">CSI (22-pin mini) — faces +X</text>
<text x="710" y="577" class="p" text-anchor="start"></text>
<text x="710" y="592" class="p" text-anchor="start">[10k↓] = 10 kΩ to GND: pins float</text>
<text x="710" y="607" class="p" text-anchor="start">         after RPi.GPIO cleanup()</text>
<text x="710" y="622" class="p" text-anchor="start">[10k↑] = 10 kΩ to 3.3 V: relay off</text>
<text x="710" y="637" class="p" text-anchor="start">         (pump off, vent closed)</text>
