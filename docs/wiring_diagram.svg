<text x="900.0" y="32" class="T" text-anchor="middle">Riftbound Card Sorter v2 — wiring block diagram</text>
<text x="900.0" y="52" class="st" text-anchor="middle">Source of truth: hardware/*.py (pins, channels). Tables: docs/ASSEMBLY.md §14. Power budget: BOM.md. All GNDs common (GND bus).</text>
<rect x="20" y="80" width="250" height="70" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="30" y="100" class="h" text-anchor="start">12 V 5 A adapter</text>
<text x="30" y="118" class="p" text-anchor="start">5.5×2.1 mm, centre +</text>
<text x="30" y="133" class="p" text-anchor="start">(owned 3 A unit: too small)</text>
<rect x="20" y="170" width="250" height="56" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="30" y="190" class="h" text-anchor="start">Barrel jack</text>
<text x="30" y="208" class="p" text-anchor="start">panel mount, tray +Y wall</text>
