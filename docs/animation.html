<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riftbound Card Sorter — Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; }
  canvas { display: block; }

  #ui-top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px; pointer-events: none; z-index: 10;
  }
  #title-block h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
  #title-block p  { font-size: 12px; color: #888; margin-top: 2px; }

  #controls {
    pointer-events: all;
    display: flex; gap: 8px; align-items: center;
  }
  .btn {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    color: #ccc; padding: 6px 14px; border-radius: 6px; font-size: 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .btn.active { background: rgba(99,120,255,0.3); border-color: #6378ff; color: #fff; }

  #stats {
    position: fixed; top: 64px; left: 20px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px 16px;
    font-size: 12px; line-height: 2;
    backdrop-filter: blur(8px); min-width: 220px;
  }
  #stats-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  #stats-count { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.2; }
  #stats-current { font-size: 12px; color: #aaa; margin-top: 4px; }
  #stats-current span { font-weight: 600; }

  #scan-overlay {
    position: fixed;
    text-align: center; pointer-events: none; z-index: 20;
    opacity: 0; transition: opacity 0.15s;
  }
  #scan-type {
    font-size: 28px; font-weight: 800; letter-spacing: 0.04em;
    text-shadow: 0 0 20px currentColor;
  }
  #scan-slot { font-size: 13px; color: #aaa; margin-top: 4px; }

  #hint {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 8px 14px;
    font-size: 11px; color: #555; line-height: 1.8; text-align: right;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-top">
  <div id="title-block">
    <h1>Riftbound Card Sorter</h1>
    <p>Live animation — cards flowing through sort cycle</p>
  </div>
  <div id="controls">
    <button class="btn" id="pause-btn" onclick="togglePause()">Pause</button>
    <button class="btn" id="speed-btn" onclick="cycleSpeed()">1× Speed</button>
  </div>
</div>

<div id="stats">
  <div id="stats-title">Cards Sorted</div>
  <div id="stats-count">0</div>
  <div id="stats-current">Waiting for first card…</div>
</div>

<div id="scan-overlay">
  <div id="scan-type">Champion</div>
  <div id="scan-slot"></div>
</div>

<div id="hint">Drag to rotate · Scroll to zoom<br>Right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Inline OrbitControls (r128) ──────────────────────────────────────────────
(function(){
  THREE.OrbitControls = function(object, domElement){
    this.object = object;
    this.domElement = domElement || document;
    this.enabled = true;
    this.target = new THREE.Vector3();
    this.minDistance = 50; this.maxDistance = 4000;
    this.minPolarAngle = 0; this.maxPolarAngle = Math.PI;
    this.enableDamping = true; this.dampingFactor = 0.06;
    this.enableZoom = true; this.zoomSpeed = 1.0;
    this.enableRotate = true; this.rotateSpeed = 0.6;
    this.enablePan = true; this.panSpeed = 0.8;
    this.screenSpacePanning = true;

    var scope = this;
    var STATE = { NONE: -1, ROTATE: 0, DOLLY: 1, PAN: 2 };
    var state = STATE.NONE;
    var EPS = 1e-6;
    var spherical = new THREE.Spherical();
    var sphericalDelta = new THREE.Spherical();
    var scale = 1;
    var panOffset = new THREE.Vector3();
    var rotateStart = new THREE.Vector2(), rotateEnd = new THREE.Vector2(), rotateDelta = new THREE.Vector2();
    var panStart = new THREE.Vector2(), panEnd = new THREE.Vector2(), panDelta = new THREE.Vector2();
    var dollyStart = new THREE.Vector2(), dollyEnd = new THREE.Vector2(), dollyDelta = new THREE.Vector2();

    function getZoomScale(){ return Math.pow(0.95, scope.zoomSpeed); }
    function rotateLeft(a){ sphericalDelta.theta -= a; }
    function rotateUp(a){ sphericalDelta.phi -= a; }
    var panLeftV = new THREE.Vector3();
    function panLeft(d, m){ panLeftV.setFromMatrixColumn(m,0); panLeftV.multiplyScalar(-d); panOffset.add(panLeftV); }
    var panUpV = new THREE.Vector3();
    function panUp(d, m){
      if(scope.screenSpacePanning){ panUpV.setFromMatrixColumn(m,1); }
      else { panUpV.setFromMatrixColumn(m,0); panUpV.crossVectors(scope.object.up, panUpV); }
      panUpV.multiplyScalar(d); panOffset.add(panUpV);
    }
    var panOffset2 = new THREE.Vector3();
    function pan(dx, dy){
      var el = scope.domElement;
      if(scope.object.isPerspectiveCamera){
        var pos = scope.object.position;
        panOffset2.copy(pos).sub(scope.target);
        var tDist = panOffset2.length();
        tDist *= Math.tan((scope.object.fov/2)*Math.PI/180);
        panLeft(2*dx*tDist/el.clientHeight, scope.object.matrix);
        panUp(2*dy*tDist/el.clientHeight, scope.object.matrix);
      }
    }
    function dollyIn(s){ scale /= s; }
    function dollyOut(s){ scale *= s; }

    this.update = function(){
      var offset = new THREE.Vector3();
      var quat = new THREE.Quaternion().setFromUnitVectors(object.up, new THREE.Vector3(0,1,0));
      var quatInverse = quat.clone().invert();
      var lastPos = new THREE.Vector3();
      var lastQuat = new THREE.Quaternion();
      return function(){
        var pos = scope.object.position;
        offset.copy(pos).sub(scope.target);
        offset.applyQuaternion(quat);
        spherical.setFromVector3(offset);
        spherical.theta += sphericalDelta.theta;
        spherical.phi += sphericalDelta.phi;
        spherical.phi = Math.max(scope.minPolarAngle, Math.min(scope.maxPolarAngle, spherical.phi));
        spherical.makeSafe();
        spherical.radius *= scale;
        spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
        scope.target.add(panOffset);
        offset.setFromSpherical(spherical);
        offset.applyQuaternion(quatInverse);
        pos.copy(scope.target).add(offset);
        scope.object.lookAt(scope.target);
        if(scope.enableDamping){
          sphericalDelta.theta *= (1-scope.dampingFactor);
          sphericalDelta.phi   *= (1-scope.dampingFactor);
          panOffset.multiplyScalar(1-scope.dampingFactor);
        } else { sphericalDelta.set(0,0,0); panOffset.set(0,0,0); }
        scale = 1;
        if(lastPos.distanceToSquared(scope.object.position)>EPS*EPS || 8*(1-lastQuat.dot(scope.object.quaternion))>EPS*EPS){
          lastPos.copy(scope.object.position); lastQuat.copy(scope.object.quaternion); return true;
        }
        return false;
      };
    }();

    function onPointerDown(e){
      if(!scope.enabled) return;
      scope.domElement.setPointerCapture(e.pointerId);
      scope.domElement.addEventListener('pointermove', onPointerMove);
      scope.domElement.addEventListener('pointerup', onPointerUp);
      if(e.button===0){ rotateStart.set(e.clientX, e.clientY); state=STATE.ROTATE; }
      else if(e.button===1){ dollyStart.set(e.clientX, e.clientY); state=STATE.DOLLY; }
      else if(e.button===2){ panStart.set(e.clientX, e.clientY); state=STATE.PAN; }
    }
    function onPointerMove(e){
      if(!scope.enabled) return;
      if(state===STATE.ROTATE){
        rotateEnd.set(e.clientX,e.clientY); rotateDelta.subVectors(rotateEnd,rotateStart).multiplyScalar(scope.rotateSpeed);
        var el=scope.domElement; rotateLeft(2*Math.PI*rotateDelta.x/el.clientHeight); rotateUp(2*Math.PI*rotateDelta.y/el.clientHeight);
        rotateStart.copy(rotateEnd);
      } else if(state===STATE.DOLLY){
        dollyEnd.set(e.clientX,e.clientY); dollyDelta.subVectors(dollyEnd,dollyStart);
        if(dollyDelta.y>0) dollyIn(getZoomScale()); else if(dollyDelta.y<0) dollyOut(getZoomScale());
        dollyStart.copy(dollyEnd);
      } else if(state===STATE.PAN){
        panEnd.set(e.clientX,e.clientY); panDelta.subVectors(panEnd,panStart).multiplyScalar(scope.panSpeed);
        pan(panDelta.x, panDelta.y); panStart.copy(panEnd);
      }
    }
    function onPointerUp(e){
      scope.domElement.releasePointerCapture(e.pointerId);
      scope.domElement.removeEventListener('pointermove',onPointerMove);
      scope.domElement.removeEventListener('pointerup',onPointerUp);
      state=STATE.NONE;
    }
    function onMouseWheel(e){
      if(!scope.enabled) return;
      e.preventDefault();
      if(e.deltaY<0) dollyOut(getZoomScale()); else dollyIn(getZoomScale());
    }
    function onContextMenu(e){ e.preventDefault(); }
    scope.domElement.addEventListener('pointerdown', onPointerDown);
    scope.domElement.addEventListener('wheel', onMouseWheel, {passive:false});
    scope.domElement.addEventListener('contextmenu', onContextMenu);
    this.dispose = function(){
      scope.domElement.removeEventListener('pointerdown',onPointerDown);
      scope.domElement.removeEventListener('wheel',onMouseWheel);
      scope.domElement.removeEventListener('contextmenu',onContextMenu);
    };
  };
})();

// ─── Scene Setup ──────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.00035);

const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W/H, 1, 8000);
// Default view: (-30, 350, 800) shows full machine with hopper left, belt center, tray right
camera.position.set(-30, 350, 800);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(-30, 30, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 100;
controls.maxDistance = 3000;
controls.update();

// ─── Lights ───────────────────────────────────────────────────────────────────
// Lower ambient so shadows read clearly; add hemisphere for sky/ground variation
scene.add(new THREE.AmbientLight(0x202030, 0.45));
scene.add(new THREE.HemisphereLight(0x304060, 0x0a0810, 0.35));

// Increase key light slightly to compensate for lower ambient
const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.7);
keyLight.position.set(400, 600, 400);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -600; keyLight.shadow.camera.right = 600;
keyLight.shadow.camera.top = 400;   keyLight.shadow.camera.bottom = -200;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc0d8ff, 0.5);
fillLight.position.set(-400, 300, 200);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffeedd, 0.35);
rimLight.position.set(0, 200, -600);
scene.add(rimLight);

// ─── Floor Grid ───────────────────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(800, 40, 0x1a1a2e, 0x111118);
gridHelper.position.y = -2;
scene.add(gridHelper);

// ─── Card Types ───────────────────────────────────────────────────────────────
// 2-floor tray: 4 columns × 2 floors = 8 slots
const FLOOR_Y = [4, 72];
const COL_ZS  = [-97.5, -32.5, 32.5, 97.5];

const CARD_TYPES = [
  { name: 'Fury',       slot: 0, floor: 0, col: 0, hex: 0xcc2233, css: '#cc2233' },
  { name: 'Mind',       slot: 1, floor: 0, col: 1, hex: 0x2244cc, css: '#2244cc' },
  { name: 'Calm',       slot: 2, floor: 0, col: 2, hex: 0x22aa44, css: '#22aa44' },
  { name: 'Body',       slot: 3, floor: 0, col: 3, hex: 0xff7700, css: '#ff7700' },
  { name: 'Chaos',      slot: 4, floor: 1, col: 0, hex: 0x9922cc, css: '#9922cc' },
  { name: 'Order',      slot: 5, floor: 1, col: 1, hex: 0xddcc00, css: '#ddcc00' },
  { name: 'Colorless',  slot: 6, floor: 1, col: 2, hex: 0x888888, css: '#888888' },
  { name: 'Reject',     slot: 7, floor: 1, col: 3, hex: 0x334455, css: '#334455' },
];
CARD_TYPES.forEach(ct => {
  ct.slotZ = COL_ZS[ct.col];
  ct.slotFloorY = FLOOR_Y[ct.floor];
});

// Domain counts tracked here for access from addCardToTray
const domainCounts = {};

// ─── Helper: box mesh ─────────────────────────────────────────────────────────
function makeBox(w, h, d, color, opacity) {
  opacity = opacity === undefined ? 1 : opacity;
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.45, metalness: 0.1,
    transparent: opacity < 1, opacity
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeWireBox(w, h, d, color) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const edges = new THREE.EdgesGeometry(geo);
  const mat = new THREE.LineBasicMaterial({ color, linewidth: 1 });
  return new THREE.LineSegments(edges, mat);
}

// ─── Machine Parts ────────────────────────────────────────────────────────────

// --- Baseplate --- lighter color so it reads against dark background
const baseMesh = makeBox(570, 6, 420, 0x2a2a3a);
baseMesh.position.set(-30, -3, 0);
scene.add(baseMesh);

// --- Hopper (left) ---
const HOPPER_X = -230;
const hopperGroup = new THREE.Group();
const hw = makeBox(6, 108, 80, 0xd0d0d8);
hw.position.set(-3, 54, 0);
hopperGroup.add(hw);
const hwf = makeBox(6, 108, 80, 0xd0d0d8, 0.25);
hwf.position.set(69, 54, 0);
hopperGroup.add(hwf);
const hs1 = makeBox(72, 6, 80, 0xd0d0d8);
hs1.position.set(33, 3, 0);
hopperGroup.add(hs1);
const hfloor = makeBox(72, 4, 80, 0xc0c0c8);
hfloor.position.set(33, 2, 0);
hopperGroup.add(hfloor);
const hside1 = makeBox(72, 108, 4, 0xd0d0d8);
hside1.position.set(33, 54, 48);
hopperGroup.add(hside1);
const hside2 = makeBox(72, 108, 4, 0xd0d0d8);
hside2.position.set(33, 54, -48);
hopperGroup.add(hside2);
hopperGroup.position.set(HOPPER_X, 0, 0);
scene.add(hopperGroup);

// Angled inner guide walls inside hopper (funnel shape to direct cards to exit)
const guideL = makeBox(6, 70, 5, 0xb8b8c4);
guideL.position.set(HOPPER_X + 15, 40, -30);
guideL.rotation.z = 0.25;
scene.add(guideL);
const guideR = makeBox(6, 70, 5, 0xb8b8c4);
guideR.position.set(HOPPER_X + 15, 40, 30);
guideR.rotation.z = 0.25;
scene.add(guideR);

const hopperWire = makeWireBox(72, 108, 80, 0x444466);
hopperWire.position.set(HOPPER_X + 33, 54, 0);
scene.add(hopperWire);

// --- Conveyor belt ---
const CONV_Y_TOP = 45;
const conveyorBody = makeBox(250, 12, 80, 0xb0b0b8);
conveyorBody.position.set(-40, CONV_Y_TOP - 6, 0);
scene.add(conveyorBody);

// Belt surface: canvas texture with horizontal stripes for animated scroll effect
const beltCanvas = document.createElement('canvas');
beltCanvas.width = 256; beltCanvas.height = 32;
const bctx = beltCanvas.getContext('2d');
for(let i = 0; i < 8; i++) {
  bctx.fillStyle = i % 2 === 0 ? '#7a7a88' : '#959596';
  bctx.fillRect(0, i * 4, 256, 4);
}
const beltTex = new THREE.CanvasTexture(beltCanvas);
beltTex.wrapS = THREE.RepeatWrapping;
beltTex.repeat.set(8, 1);
const beltSurfMat = new THREE.MeshStandardMaterial({
  map: beltTex, roughness: 0.6, metalness: 0.05,
  emissive: new THREE.Color(0x888896), emissiveIntensity: 0.05
});
const beltSurf = new THREE.Mesh(new THREE.BoxGeometry(248, 2, 76), beltSurfMat);
beltSurf.position.set(-40, CONV_Y_TOP + 1, 0);
beltSurf.castShadow = true;
beltSurf.receiveShadow = true;
scene.add(beltSurf);

// Belt legs
for(let lx of [-140, -40, 60]) {
  const leg = makeBox(8, CONV_Y_TOP - 12, 8, 0x909098);
  leg.position.set(lx, (CONV_Y_TOP - 12)/2, 30);
  scene.add(leg);
  const leg2 = makeBox(8, CONV_Y_TOP - 12, 8, 0x909098);
  leg2.position.set(lx, (CONV_Y_TOP - 12)/2, -30);
  scene.add(leg2);
}

// Conveyor end rollers at belt ends
const rollerGeo = new THREE.CylinderGeometry(8, 8, 76, 16);
const rollerMat = new THREE.MeshStandardMaterial({ color: 0x606068, roughness: 0.3, metalness: 0.6 });
for (const rx of [-140, 60]) {
  const roller = new THREE.Mesh(rollerGeo, rollerMat);
  roller.rotation.x = Math.PI / 2;
  roller.position.set(rx, CONV_Y_TOP - 6, 0);
  roller.castShadow = true;
  scene.add(roller);
}

// --- Scanner hood --- dedicated matte-black material
const hoodMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.85, metalness: 0.15 });
const scannerHood = new THREE.Mesh(new THREE.BoxGeometry(80, 65, 100), hoodMat);
scannerHood.castShadow = true;
scannerHood.receiveShadow = true;
scannerHood.position.set(-40, CONV_Y_TOP + 32.5, 0);
scene.add(scannerHood);

// Camera lens aperture on hood underside
const lensGeo = new THREE.CylinderGeometry(7, 7, 2, 20);
const lensMat = new THREE.MeshStandardMaterial({
  color: 0x001122, roughness: 0.05, metalness: 0.9,
  emissive: new THREE.Color(0x002244), emissiveIntensity: 0.4
});
const lens = new THREE.Mesh(lensGeo, lensMat);
lens.rotation.x = Math.PI / 2;
lens.position.set(-40, CONV_Y_TOP + 3, 0);
scene.add(lens);

// Lens retaining ring
const lensRing = new THREE.Mesh(
  new THREE.TorusGeometry(8, 1.5, 8, 20),
  new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.5, metalness: 0.6 })
);
lensRing.rotation.x = Math.PI / 2;
lensRing.position.set(-40, CONV_Y_TOP + 3, 0);
scene.add(lensRing);

// Scanner LED strip: emissive material that pulses during scan phase
const scanLEDMat = new THREE.MeshStandardMaterial({
  color: 0x00aaff,
  emissive: new THREE.Color(0x0055cc),
  emissiveIntensity: 1.2,
  transparent: true, opacity: 0.85,
  roughness: 0.1, metalness: 0.2
});
const scanLED = new THREE.Mesh(new THREE.BoxGeometry(78, 3, 3), scanLEDMat);
scanLED.position.set(-40, CONV_Y_TOP + 0.5, 20);
scene.add(scanLED);

// Scanner opening slot
const scanSlot = makeBox(2, 6, 80, 0x222233);
scanSlot.position.set(-80, CONV_Y_TOP + 2, 0);
scene.add(scanSlot);

// Flash point light inside scanner (animated during scan phase)
const scanFlash = new THREE.PointLight(0xffffff, 0, 100);
scanFlash.position.set(-40, CONV_Y_TOP + 20, 0);
scene.add(scanFlash);

// Wide soft bloom light for scan glow effect
const scanBloom = new THREE.PointLight(0x0088ff, 0, 300);
scanBloom.decay = 2;
scene.add(scanBloom);

// Thin cyan scan line that sweeps across the card during scan phase
const scanLineMat = new THREE.MeshStandardMaterial({
  color: 0x00ffff,
  emissive: new THREE.Color(0x00ffff),
  emissiveIntensity: 4.0,
  transparent: true, opacity: 0.8
});
const scanLine = new THREE.Mesh(new THREE.BoxGeometry(63, 2, 2), scanLineMat);
scanLine.visible = false;
scene.add(scanLine);

// --- Sort gate servo + paddle ---
const GATE_X = 60;
const gateBase = makeBox(20, 30, 20, 0xc0c0c8);
gateBase.position.set(GATE_X, CONV_Y_TOP + 15, 0);
scene.add(gateBase);

const paddleGeo = new THREE.BoxGeometry(4, 55, 18);
const paddleMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e8, roughness: 0.3 });
const paddleMesh = new THREE.Mesh(paddleGeo, paddleMat);
paddleMesh.castShadow = true;
const paddlePivot = new THREE.Group();
paddlePivot.position.set(GATE_X, CONV_Y_TOP + 15, 0);
paddlePivot.add(paddleMesh);
paddleMesh.position.set(0, 0, 0);
// Connecting shaft from servo to paddle
const shaftMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(3, 3, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0x888890, roughness: 0.3, metalness: 0.7 })
);
shaftMesh.position.set(0, 8, 0);
paddlePivot.add(shaftMesh);
// Tip indicator on paddle bottom (contact face)
const tipMesh = new THREE.Mesh(
  new THREE.BoxGeometry(6, 4, 20),
  new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4, emissive: 0x442200, emissiveIntensity: 0.3 })
);
tipMesh.position.set(0, -30, 0);
paddlePivot.add(tipMesh);
scene.add(paddlePivot);

// --- Sorting tray (right side) ---
const TRAY_X_START = 85;
const TRAY_X_END   = 170;
const TRAY_Y_BASE  = 0;
const TRAY_FLOOR_H = 65;
const TRAY_SHELF_H = 3;
const TRAY_Z_HALF  = 130;

const TX_MID = (TRAY_X_START + TRAY_X_END) / 2;
const TX_DEP = TRAY_X_END - TRAY_X_START;

function makeTrayFloor(yBase, colorHex) {
  const fl = makeBox(TX_DEP, 3, TRAY_Z_HALF * 2, colorHex);
  fl.position.set(TX_MID, yBase + 1.5, 0);
  scene.add(fl);
  const bw = makeBox(3, TRAY_FLOOR_H, TRAY_Z_HALF * 2, colorHex);
  bw.position.set(TRAY_X_END - 1.5, yBase + TRAY_FLOOR_H/2, 0);
  scene.add(bw);
  const lw = makeBox(TX_DEP, TRAY_FLOOR_H, 2.5, colorHex);
  lw.position.set(TX_MID, yBase + TRAY_FLOOR_H/2, -TRAY_Z_HALF - 1.25);
  scene.add(lw);
  const rw = makeBox(TX_DEP, TRAY_FLOOR_H, 2.5, colorHex);
  rw.position.set(TX_MID, yBase + TRAY_FLOOR_H/2, TRAY_Z_HALF + 1.25);
  scene.add(rw);
  for(let i = 1; i < 4; i++) {
    const dz = -TRAY_Z_HALF + i * 65;
    const dv = makeBox(TX_DEP, TRAY_FLOOR_H, 2, colorHex);
    dv.position.set(TX_MID, yBase + TRAY_FLOOR_H/2, dz);
    scene.add(dv);
  }
  // Label markers colored by domain so viewer can identify each bin
  const floorIdx = (yBase === FLOOR_Y[0] - 4) ? 0 : 1;
  for(let i = 0; i < 4; i++) {
    const domainEntry = CARD_TYPES.find(t => t.floor === floorIdx && t.col === i);
    const labelColor = domainEntry ? domainEntry.hex : 0x446688;
    const lm = makeWireBox(6, 5, 10, labelColor);
    lm.position.set(TRAY_X_START + 3, yBase + 3, COL_ZS[i]);
    scene.add(lm);
  }
}

// ─── Card Textures ────────────────────────────────────────────────────────────
// Per-type canvas textures with border frame, color panel, art strip
function makeCardTexture(hexColor) {
  const c = document.createElement('canvas');
  c.width = 126; c.height = 176;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(0, 0, 126, 176);
  const r = (hexColor >> 16) & 0xff, g = (hexColor >> 8) & 0xff, b = hexColor & 0xff;
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(10, 10, 106, 156);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(10, 10, 106, 40);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, 120, 170);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 106, 156);
  return new THREE.CanvasTexture(c);
}
const cardTextures = {};
CARD_TYPES.forEach(t => { cardTextures[t.slot] = makeCardTexture(t.hex); });

// ─── Active Card Mesh ─────────────────────────────────────────────────────────
// BoxGeometry(63, 2, 88): 63mm wide in X, 2mm thick in Y, 88mm long in Z
const CARD_W = 63, CARD_H = 88, CARD_T = 2;
const activeCardGeo = new THREE.BoxGeometry(CARD_W, CARD_T, CARD_H);
const activeCardMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.2, metalness: 0.0,
  emissive: 0xffffff, emissiveIntensity: 0,
  transparent: true, opacity: 1.0   // transparent flag enables opacity animation
});
const activeCard = new THREE.Mesh(activeCardGeo, activeCardMat);
activeCard.castShadow = true;
scene.add(activeCard);
activeCard.visible = false;

// Card glow: increased range (160) and physical falloff

cardGlow.decay = 2;
scene.add(cardGlow);

// ─── Tray Card Accumulation ───────────────────────────────────────────────────
const trayCards = {};
const trayArrivals = []; // {mesh, startY, targetY, t} — animates card settling into slot

function addCardToTray(ct) {
  const key = `${ct.floor}_${ct.col}`;
  if(!trayCards[key]) trayCards[key] = [];
  const arr = trayCards[key];
  if(arr.length >= 3) {
    const old = arr.shift();
    scene.remove(old);
    old.geometry.dispose();
    old.material.dispose();
  }
  const cardIdx = arr.length;
  const TRAY_CARD_H = 58; // shorter than active card so it fits within tray wall height
  // Tray cards stand upright: 2mm thick in X, 58mm tall in Y, 63mm wide in Z
  const geo = new THREE.BoxGeometry(CARD_T, TRAY_CARD_H, CARD_W);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.18, metalness: 0.0,
    emissive: ct.hex, emissiveIntensity: 0.25,
    map: cardTextures[ct.slot]
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  const targetY = ct.slotFloorY + 29; // 29 = 58/2 so card base sits on floor
  const startY  = targetY + 30; // start above, animate down
  mesh.position.set(
    TRAY_X_START + 4 + cardIdx * (CARD_T + 1),
    startY,
    ct.slotZ
  );
  scene.add(mesh);
  arr.push(mesh);
  trayArrivals.push({ mesh, startY, targetY, t: 0 });

  // Flash point light burst at slot position on card arrival
  const flashLight = new THREE.PointLight(ct.hex, 3.0, 80);
  flashLight.position.copy(mesh.position);
  scene.add(flashLight);
  if(!window._flashLights) window._flashLights = [];
  window._flashLights.push({ light: flashLight, age: 0 });

  // Track per-domain sort count
  domainCounts[ct.name] = (domainCounts[ct.name] || 0) + 1;
}

// ─── Animation State ──────────────────────────────────────────────────────────
let paused = false;
let speedMult = 1;
const SPEEDS = [0.5, 1, 2];
let speedIdx = 1;

let totalSorted = 0;
let cycleIdx = 0;   // which card type (0..7)
let cycleT = 0;     // elapsed time within current cycle

// Extended scan phase (0.6s), new armReturn phase, CYCLE_DUR = 6.8s
const CYCLE_DUR = 6.8;
const PH = {
  armDescend:  [0.0, 0.5],
  armLift:     [0.5, 1.0],
  armSwing:    [1.0, 1.5],
  conveyorIn:  [1.5, 2.5],
  scan:        [2.5, 3.1],   // extended from 0.3s to 0.6s for visible flash
  conveyorOut: [3.1, 3.8],
  deflect:     [3.8, 4.8],
  slotDrop:    [4.8, 5.8],
  armReturn:   [5.8, 6.3],   // new: arm returns to rest time-based (no snap)
  pause:       [6.3, 6.8],
};

// Easing variants: each tuned for its physical analogue
function easeIn(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * t;          // cubic ease-in (gravity-assisted descent)
}
function easeOut(t) {
  t = Math.max(0, Math.min(1, t));
  return 1 - Math.pow(1 - t, 3); // cubic ease-out (decelerate at top of lift)
}
function easeInOut(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);   // cubic smoothstep (C2, no midpoint jerk)
}

// phaseT: eased 0..1 within a phase (optional easing fn)
function phaseT(ph, easingFn) {
  const [s, e] = ph;
  const fn = easingFn || easeInOut;
  return fn((cycleT - s) / (e - s));
}
// phaseRaw: linear 0..1 within a phase (for belt motion — constant speed)
function phaseRaw(ph) {
  const [s, e] = ph;
  return Math.max(0, Math.min(1, (cycleT - s) / (e - s)));
}
function inPhase(ph) {
  return cycleT >= ph[0] && cycleT < ph[1];
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function togglePause() {
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Play' : 'Pause';
  document.getElementById('pause-btn').classList.toggle('active', paused);
}

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  speedMult = SPEEDS[speedIdx];
  document.getElementById('speed-btn').textContent = speedMult + '× Speed';
}

function updateStatsUI(cardType) {
  document.getElementById('stats-count').textContent = totalSorted;
  if(cardType) {
    const floorLabel = ['Lower', 'Upper'][cardType.floor];
    document.getElementById('stats-current').innerHTML =
      `Current: <span style="color:${cardType.css}">${cardType.name}</span>` +
      ` → ${floorLabel} floor, col ${cardType.col + 1}`;
  }
  // Per-domain breakdown
  let breakdownHtml = '';
  CARD_TYPES.forEach(t => {
    const count = domainCounts[t.name] || 0;
    if(count > 0) {
      breakdownHtml += `<div><span style="color:${t.css}">●</span> ${t.name}: ${count}</div>`;
    }
  });
  let bd = document.getElementById('stats-breakdown');
  if(!bd) {
    bd = document.createElement('div');
    bd.id = 'stats-breakdown';
    bd.style.cssText = 'font-size:11px;color:#888;margin-top:4px;line-height:1.6';
    document.getElementById('stats').appendChild(bd);
  }
  bd.innerHTML = breakdownHtml;
}

function showScanOverlay(cardType, visible) {
  const el = document.getElementById('scan-overlay');
  el.style.opacity = visible ? '1' : '0';
  if(visible && cardType) {
    document.getElementById('scan-type').textContent = cardType.name;
    document.getElementById('scan-type').style.color = cardType.css;
    const floorLabel = ['Lower', 'Upper'][cardType.floor];
    document.getElementById('scan-slot').textContent =
      `→ ${floorLabel} floor · Col ${cardType.col + 1}`;
  }
}

// Paddle angle: maps slotZ to rotation angle (flat = center, ±90° for edges)
function paddleAngleForSlot(slotZ) {
  return -(slotZ / 160) * (Math.PI / 2.5);
}

// ─── Hopper stack (dynamic — shrinks each cycle, refills after 6 cards) ───────
const stackGroup = new THREE.Group();
const stackCards = [];
for(let i = 0; i < 6; i++) {
  const sg = new THREE.BoxGeometry(CARD_W, CARD_T, CARD_H);
  const sm = new THREE.MeshStandardMaterial({ color: 0xddddee, roughness: 0.3 });
  const sc = new THREE.Mesh(sg, sm);
  sc.position.set(HOPPER_X + 33, CARD_T/2 + 6 + i * (CARD_T + 0.5), 0);
  sc.castShadow = true;
  stackGroup.add(sc);
  stackCards.push(sc);
}
scene.add(stackGroup);
let stackTopIdx = stackCards.length - 1; // index of the topmost visible card

// ─── Render Loop ──────────────────────────────────────────────────────────────
let lastTime = null;
let prevCt = null; // track card type changes for map updates

function animate(ts) {
  requestAnimationFrame(animate);

  if(lastTime === null) lastTime = ts;
  let dt = (ts - lastTime) / 1000;
  lastTime = ts;
  dt = Math.min(dt, 0.1); // clamp to prevent big jumps on tab refocus

  if(!paused) cycleT += dt * speedMult;

  // ── Advance cycle ──
  if(cycleT >= CYCLE_DUR) {
    cycleT -= CYCLE_DUR;
    totalSorted++;
    const completedCt = CARD_TYPES[cycleIdx];
    addCardToTray(completedCt);
    cycleIdx = (cycleIdx + 1) % CARD_TYPES.length;

    // Reset paddle to neutral at cycle start
    paddlePivot.rotation.z = 0;

    // Hide top stack card; refill when all 6 used
    if(stackCards[stackTopIdx]) {
      stackCards[stackTopIdx].visible = false;
      stackTopIdx = Math.max(0, stackTopIdx - 1);
      // Re-show all cards when the last one (index 0) was just hidden
      if(stackTopIdx <= 0 && !stackCards[0].visible) {
        stackCards.forEach(c => { c.visible = true; });
        stackTopIdx = stackCards.length - 1;
        // Reset positions in case they were animated
        stackCards.forEach((c, i) => {
          c.position.set(HOPPER_X + 33, CARD_T/2 + 6 + i * (CARD_T + 0.5), 0);
        });
      }
    }
  }

  const ct = CARD_TYPES[cycleIdx];

  // ── Tray card arrival animation (settle into slot) ──
  for(let i = trayArrivals.length - 1; i >= 0; i--) {
    const a = trayArrivals[i];
    a.t = Math.min(1, a.t + dt * speedMult * 3.5);
    a.mesh.position.y = THREE.MathUtils.lerp(a.startY, a.targetY, easeOut(a.t));
    if(a.t >= 1) trayArrivals.splice(i, 1);
  }

  // ── Decay arrival flash lights ──
  if(window._flashLights) {
    window._flashLights = window._flashLights.filter(f => {
      f.age += dt;
      f.light.intensity = Math.max(0, 3.0 * (1 - f.age / 0.5));
      if(f.age > 0.5) { scene.remove(f.light); return false; }
      return true;
    });
  }

  // ── Update UI ──
  updateStatsUI(ct);
  if(cycleT >= PH.scan[0] && cycleT < PH.scan[0] + 0.8) {
    showScanOverlay(ct, true);
  } else {
    showScanOverlay(ct, false);
  }

  // ── Active card color / texture (update map only when card type changes) ──
  activeCardMat.color.set(0xffffff); // white so texture renders at face value; emissive carries domain tint
  activeCardMat.emissive.setHex(ct.hex);
  if(prevCt !== ct) {
    activeCardMat.map = cardTextures[ct.slot];
    activeCardMat.needsUpdate = true;
    prevCt = ct;
  }
  cardGlow.color.setHex(ct.hex);

  // Pivot world position for cup math
  const PIV_X = HOPPER_X + 36;
  const PIV_Y = 108;

  // ── Phases 1a–1c: Arm descend / lift / swing (0..1.5s) ──
  // Card is visible and tracks the suction cup throughout
  if(cycleT < PH.conveyorIn[0]) {
    if(inPhase(PH.armDescend)) {
      // Gravity-assisted descent: ease-in; end at -0.036 rad to center cup over card stack
      const pt = phaseT(PH.armDescend, easeIn);
      suctionPivot.rotation.z = THREE.MathUtils.lerp(-0.35, -0.036, pt);
    } else if(inPhase(PH.armLift)) {
      // Against gravity: ease-out (decelerates at top); swing rightward toward belt
      const lt = phaseT(PH.armLift, easeOut);
      suctionPivot.rotation.z = THREE.MathUtils.lerp(-0.036, 0.80, lt);
    } else if(inPhase(PH.armSwing)) {
      // Servo swing toward belt deposit position (+1.57 = horizontal right)
      const st = phaseT(PH.armSwing);
      suctionPivot.rotation.z = THREE.MathUtils.lerp(0.80, 1.57, st);
    }

    // Animate top stack card rising with the arm during armLift
    if(inPhase(PH.armLift) && stackCards[stackTopIdx]) {
      const lt = phaseRaw(PH.armLift);
      const baseY = CARD_T/2 + 6 + stackTopIdx * (CARD_T + 0.5);
      stackCards[stackTopIdx].position.y = baseY + lt * 20;
    }

    // Card tracks suction cup
    const armRot = suctionPivot.rotation.z;
    const cupX = PIV_X + 83 * Math.sin(armRot);
    const cupY = PIV_Y - 83 * Math.cos(armRot);
    activeCard.visible = true;
    activeCard.position.set(cupX, cupY, 0);
    activeCard.rotation.set(0, 0, armRot - Math.PI / 2);
    activeCardMat.opacity = 1.0;
    activeCardMat.emissiveIntensity = 0;
    cardGlow.intensity = 0;
    scanFlash.intensity = 0;
    scanBloom.intensity = 0;
    scanLine.visible = false;
  }

  // ── Phase 2: Card on conveyor (1.5..2.5s) ──
  else if(inPhase(PH.conveyorIn)) {
    suctionPivot.rotation.z = 1.57; // arm stays at deposit position (pointing right)
    activeCard.visible = true;
    activeCard.rotation.set(0, 0, 0); // card lies flat
    const ct2 = phaseRaw(PH.conveyorIn); // LINEAR — belt runs at constant speed
    activeCardMat.opacity = Math.min(1, ct2 * 5); // fade in over first 0.2s
    // Card starts at cup deposit X (-111) and travels to scanner center (-40)
    const cx = THREE.MathUtils.lerp(-111, -40, ct2);
    activeCard.position.set(cx, CONV_Y_TOP + CARD_T/2 + 1, 0);
    scanFlash.intensity = 0;
    scanBloom.intensity = 0;
    activeCardMat.emissiveIntensity = 0.2;
    cardGlow.intensity = 0.5;
    cardGlow.position.copy(activeCard.position);
    cardGlow.position.y += 10;
    // Scroll belt texture to imply motion
    beltTex.offset.x -= dt * speedMult * 0.08;
    scanLine.visible = false;
  }

  // ── Phase 3: Scanner flash (2.5..3.1s) ──
  else if(inPhase(PH.scan)) {
    activeCard.visible = true;
    activeCardMat.opacity = 1.0;
    activeCard.rotation.set(0, 0, 0);
    activeCard.position.set(-40, CONV_Y_TOP + CARD_T/2 + 1, 0);
    const ft = phaseRaw(PH.scan);
    // Smooth bell curve flash (peaks at ft=0.5, sharp leading edge)
    const flashIntensity = Math.sin(ft * Math.PI);
    scanFlash.intensity = flashIntensity * 3;
    scanFlash.position.set(-40, CONV_Y_TOP + 10, 0);
    activeCardMat.emissiveIntensity = 0.2 + flashIntensity * 0.5;
    cardGlow.intensity = 1.5 + flashIntensity;
    cardGlow.position.copy(activeCard.position);
    cardGlow.position.y += 10; // above card for top-face highlight
    // Scanner LED pulses brightly during scan
    scanLEDMat.emissiveIntensity = 1.2 + flashIntensity * 3.0;
    // Wide bloom soft halo around scanner
    scanBloom.intensity = flashIntensity * 0.8;
    scanBloom.position.set(-40, CONV_Y_TOP + 15, 0);
    // Scan line sweeps across the card in Z direction
    scanLine.visible = true;
    scanLine.position.set(
      -40,
      CONV_Y_TOP + CARD_T/2 + 3,
      THREE.MathUtils.lerp(-CARD_H/2, CARD_H/2, ft)
    );
    // Belt scrolls while card sits under scanner
    beltTex.offset.x -= dt * speedMult * 0.02;
    // World-to-screen projection for scan overlay
    const _sv = activeCard.position.clone().project(camera);
    const _sx = (_sv.x * 0.5 + 0.5) * window.innerWidth;
    const _sy = (-_sv.y * 0.5 + 0.5) * window.innerHeight;
    const _ov = document.getElementById('scan-overlay');
    _ov.style.left = _sx + 'px';
    _ov.style.top  = (_sy - 90) + 'px';
    _ov.style.transform = 'translateX(-50%)';
  }

  // ── Phase 4: Conveyor to gate (3.1..3.8s) ──
  else if(inPhase(PH.conveyorOut)) {
    activeCard.visible = true;
    activeCardMat.opacity = 1.0;
    activeCard.rotation.set(0, 0, 0);
    const ot = phaseRaw(PH.conveyorOut); // LINEAR for card position (belt speed)
    activeCard.position.set(
      THREE.MathUtils.lerp(-40, GATE_X, ot),
      CONV_Y_TOP + CARD_T/2 + 1, 0
    );
    // Paddle uses easing (servo has inertia)
    const targetAngle = paddleAngleForSlot(ct.slotZ);
    paddlePivot.rotation.z = THREE.MathUtils.lerp(0, targetAngle, easeInOut(ot));
    scanFlash.intensity = 0;
    scanBloom.intensity = 0;
    scanLEDMat.emissiveIntensity = 1.2; // LED back to idle glow
    scanLine.visible = false;
    activeCardMat.emissiveIntensity = 0.2;
    cardGlow.intensity = 0.8;
    cardGlow.position.copy(activeCard.position);
    // Belt still scrolling
    beltTex.offset.x -= dt * speedMult * 0.08;
  }

  // ── Phase 5: Deflect toward slot (3.8..4.8s) ──
  else if(inPhase(PH.deflect)) {
    activeCard.visible = true;
    activeCardMat.opacity = 1.0;
    const dt2 = phaseT(PH.deflect);
    const cx = THREE.MathUtils.lerp(GATE_X, TRAY_X_START + 20, dt2);
    const cz = THREE.MathUtils.lerp(0, ct.slotZ, dt2);
    const arcY = ct.floor === 1 ? CONV_Y_TOP + 30 : CONV_Y_TOP;
    const cy = THREE.MathUtils.lerp(CONV_Y_TOP + CARD_T/2 + 1, arcY, dt2);
    activeCard.position.set(cx, cy, cz);
    activeCard.rotation.y = THREE.MathUtils.lerp(0, -0.3 * Math.sign(ct.slotZ || 0), dt2);
    activeCard.rotation.x = 0;
    activeCard.rotation.z = 0;
    cardGlow.intensity = 0.6;
    cardGlow.position.copy(activeCard.position);
    beltTex.offset.x -= dt * speedMult * 0.04;
  }

  // ── Phase 6: Drop into slot (4.8..5.8s) ──
  else if(inPhase(PH.slotDrop)) {
    activeCard.visible = true;
    const dt3 = phaseT(PH.slotDrop, easeIn); // gravity-assisted drop
    const targetY = ct.slotFloorY + 29; // 29 = 58/2 matches tray card rest height
    const cy = THREE.MathUtils.lerp(CONV_Y_TOP + CARD_T/2 + 1, targetY, dt3);
    activeCard.position.set(TRAY_X_START + 20, cy, ct.slotZ);
    activeCard.rotation.y = 0;
    // X-axis rotation stands the card upright: 88mm Z extent rotates onto +Y axis
    activeCard.rotation.x = THREE.MathUtils.lerp(0, -Math.PI / 2, dt3);
    activeCard.rotation.z = 0;
    // Fade out over last 0.25s of the phase (dt3 > 0.75)
    activeCardMat.opacity = THREE.MathUtils.lerp(1, 0, Math.max(0, (dt3 - 0.75) * 4));
    cardGlow.intensity = THREE.MathUtils.lerp(0.6, 0, dt3);
    cardGlow.position.copy(activeCard.position);
    beltTex.offset.x -= dt * speedMult * 0.04;
  }

  // ── Phase 7: Arm return (5.8..6.3s) ──
  // Time-based lerp guarantees arm arrives exactly at -0.35 — no single-frame snap
  else if(inPhase(PH.armReturn)) {
    const art = phaseT(PH.armReturn);
    suctionPivot.rotation.z = THREE.MathUtils.lerp(1.57, -0.35, art);
    activeCard.visible = false;
    activeCardMat.opacity = 0;
    cardGlow.intensity = 0;
    scanFlash.intensity = 0;
    scanBloom.intensity = 0;
    scanLine.visible = false;
  }

  // ── Phase 8: Pause (6.3..6.8s) ──
  else {
    suctionPivot.rotation.z = -0.35; // locked at rest angle
    activeCard.visible = false;
    activeCardMat.opacity = 0;
    cardGlow.intensity = 0;
    scanFlash.intensity = 0;
    scanBloom.intensity = 0;
    scanLine.visible = false;
  }

  // Belt emissive flicker implies motion throughout the cycle
  beltSurfMat.emissiveIntensity = 0.05 + 0.03 * Math.sin(cycleT * 10);

  // Camera auto-orbit: gentle ellipse centered on true machine midpoint X=-30
  if(!controls.enableRotate || !controls._userInteracted) {
    const orbitAngle = ts * 0.000025 + Math.PI * 0.3; // phase offset for 3/4 front view
    const orbitR = 750;
    camera.position.x = orbitR * 0.45 * Math.cos(orbitAngle) - 30;
    camera.position.z = orbitR * Math.sin(orbitAngle);
    camera.position.y = 350 + 50 * Math.sin(ts * 0.00008);
    controls.target.set(-30, 30, 0);
    camera.lookAt(-30, 30, 0);
  }

  controls.update();
  renderer.render(scene, camera);
}

// Detect user orbit interaction to pause auto-orbit
controls.domElement.addEventListener('pointerdown', () => { controls._userInteracted = true; });

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
